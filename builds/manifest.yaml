# Build manifest — the checklist that stops a build being half-done and forgotten.
#
# Seven ops files in this project were generated, queued, and never run. The runner
# logs looked healthy; a deadlocked sequencer meant nothing behind it ever started.
# Nobody noticed for hours. Separately, the Moot Hall descent verified BUILT 5/5 on
# block sampling and was still an unusable shaft, because placement and traversability
# are different properties.
#
# So every build unit is listed here with BOTH kinds of check:
#   ops:    the ops file(s) — sampled against the world by verify_ops.py
#   walk:   from/to pairs — flood-filled by reachability.mjs
# and `python3 scripts/build_status.py` reports the lot in one table.
#
# RULES:
#  * A unit with no `walk:` must say why in `walk_na:` — silence is not an answer.
#    Most things people enter need a walk check; a canopy 20 blocks overhead does not.
#  * `retired: <reason>` marks a unit deliberately removed. Retired units are not
#    failures, but they stay listed so the record shows what happened to them.
#  * Add the unit here WHEN YOU GENERATE THE OPS, not when you finish. The point is
#    to have an entry sitting there red until the work is actually done.
#  * `both_ways: true` runs the walk in REVERSE as well, and you almost always want it.
#    A player can fall any distance but only climb one block, so a downward-only check
#    passes on a hole. Every basement in this town "passed" that way before the reverse
#    check was added; the Moot Hall's were in fact completely sealed.
#  * Walk coordinates are MEASURED standable cells, not levels read off a design doc.
#    Nearly every false failure in this file's first run was a target sitting one or two
#    blocks inside a floor slab, a bookshelf or a stage deck. Probe before asserting.

units:

  # ---------------------------------------------------------------- Ravensreach
  - name: library
    ops: [lib1_shell.txt, lib2_stairs.txt, lib3_fit.txt]
    walk:
      # in at the front door, and every one of the six storeys must be reachable.
      # The stair core originally built five straight flights in ONE footprint, each a
      # step short of its landing: you could fall to B3 but not climb to the first or
      # second floor. Rebuilt as switchbacks; this check is what found it.
      - from: [-128, 68, -424]
        both_ways: true
        to: [[-137, 68, -436], [-137, 76, -436], [-134, 84, -436],
             [-137, 61, -436], [-137, 54, -436], [-137, 47, -436]]

  - name: amsterdam-square
    ops: [sq1.txt, fix18_square_access.txt]
    placement_ops: [fix18_square_access.txt]
    walk:
      - from: [-85, 68, -370]
        both_ways: true
        # A return from the north apron has to go around the Moot Hall footprint;
        # the default 14-block search box clips both side passages.
        pad: 18
        to: [[-103, 68, -350], [-85, 68, -394], [-67, 68, -360]]

  - name: walkways
    ops: [walk1.txt, fix19_walkway_axis.txt]
    placement_ops: [fix19_walkway_axis.txt]
    walk:
      # the whole point of the road network is that these connect
      - from: [-85, 68, -394]
        both_ways: true
        # Ravensgate replaces the straight pavilion road. Its return route turns
        # west through Bell-Gate, outside the default 14-block search envelope.
        pad: 30
        to: [[-108, 68, -430], [-85, 68, -440]]

  - name: market-hall-interior
    ops: [int1_market.txt, fix16_market_access.txt]
    placement_ops: [fix16_market_access.txt]
    walk:
      # Measured after the 2026-07-26 repair: south entrance -> main hall ->
      # Works Terrace -> east loft -> bridge -> west loft.
      - from: [-51, 68, -343]
        both_ways: true
        to:
          - [-56, 68, -336]
          - [-46, 71, -340]
          - [-46, 77, -333]
          - [-68, 77, -328]
      - from: [-51, 68, -343]
        box: [-72, 68, -343, -40, 78, -324]
        pad: 12
        min_coverage: 85

  - name: grange-hall-interior
    ops: [int2_grange.txt, fix17_grange_access.txt]
    placement_ops: [fix17_grange_access.txt]
    walk:
      # Measured after the 2026-07-26 repair: west entry -> hall -> wall-walk ->
      # new west-bay upper stair -> the complete craft loft.
      - from: [-66, 68, -361]
        both_ways: true
        to:
          - [-50, 68, -366]
          - [-61, 74, -362]
          - [-61, 83, -356]
          - [-45, 83, -360]
      - from: [-66, 68, -361]
        box: [-64, 68, -369, -42, 83, -353]
        pad: 12
        min_coverage: 90

  - name: farms
    ops: [int3_farms.txt]
    walk_na: irrigation and tilled soil, nothing to enter

  - name: moot-hall-penthouse
    ops: [sn1_penthouse.txt]
    walk:
      - from: [-85, 88, -382]
        to: [[-96, 88, -388], [-80, 88, -374]]

  - name: moot-hall-core
    ops: [fix9_core.txt, fix10_corridor.txt, fix11_portal.txt, fix12_shaft.txt,
          fix14_core_access.txt]
    placement_ops: [fix14_core_access.txt]
    walk:
      # One vertical core serving penthouse -> ground -> B1 -> B2 -> the deep corridor.
      # Before it existed the basements were SEALED: the whole basement programme
      # (3-screen multiplex, bowling alley, two-level bar, arcade, bank, IT office)
      # had no way in or out. Three separate corridor ceilings each re-sealed this
      # shaft during the repair, which is why the shaft is now carved LAST.
      - from: [-85, 68, -370]
        both_ways: true
        to: [[-97, 65, -389], [-97, 57, -389], [-97, 44, -389]]

  - name: sanctum-descent
    ops: [sn2_descent.txt, fix14_core_access.txt]
    placement_ops: [fix14_core_access.txt]
    walk:
      - from: [-95, 88, -388]
        both_ways: true
        to: [[-97, 44, -389]]

  - name: sanctum
    ops: [sn3_sanctum.txt, fix15_sanctum_rigging.txt]
    walk:
      # measured: the stage deck is y29 so you stand at y30; the seating rings rise
      # 1 per row from y27, so a "floor at y27" target lands inside the tiers. The
      # processional route bends 42 blocks south of the endpoints, hence pad 50.
      - from: [-97, 44, -389]
        pad: 50
        both_ways: true
        to: [[-85, 30, -380]]

  # ---------------------------------------------------------------- Westlight
  - name: westlight-site
    ops: [wl0_site.txt]
    walk_na: ground grading only
    placement_na: >
      Deliberately built over. This graded the site to grass at y67; the bowl and
      canopy then replaced most of it, so sampling it reports MISSING correctly.

  - name: westlight-theatre
    ops: [wl1_theatre.txt]
    walk:
      # Measured after the 2026-07-26 circulation repair: exterior forecourt ->
      # all three lobby floors -> orchestra / parterre -> upper balcony. The wide
      # target spread makes the flood include the switchbacks rather than assuming
      # a straight-line search box. All coordinates are standable cells.
      - from: [-354, 68, -498]
        pad: 30
        both_ways: true
        to:
          - [-360, 19, -512]
          - [-370, 30, -514]
          - [-360, 41, -512]
          - [-401, 34, -578]
          - [-392, 36, -590]
          - [-375, 45, -596]
      # Point checks above enforce return routes. This measured box prevents a few
      # reachable points from masking a mostly sealed venue: current coverage is 91%.
      - from: [-354, 68, -498]
        box: [-421, 18, -613, -299, 50, -498]
        pad: 2
        min_coverage: 85

  - name: westlight-bowl
    ops: [wl2_bowl.txt, wl5_bowl_access.txt]
    # The theatre circulation and texture pass intentionally overwrite sampled
    # cells from the original bowl file. This last phase is the canonical route.
    placement_ops: [wl5_bowl_access.txt]
    walk:
      # Public forecourt -> grade concourse -> field -> upper tier -> rim. The old
      # start was inside a four-high column and the old rim target was a solid block.
      - from: [-359, 68, -498]
        pad: 40
        both_ways: true
        to:
          - [-354, 68, -530]
          - [-360, 59, -560]
          - [-306, 76, -560]
          - [-293, 83, -560]

  - name: westlight-canopy
    ops: [wl3_canopy.txt, wl3_canopy_worldedit.txt]
    walk_na: a roof 20 blocks above the rim, deliberately unreachable

  - name: westlight-texture
    ops: [wl4_texture.txt]
    walk_na: material scatter over already-checked geometry

  - name: members-club-lounge
    ops: [wl1_theatre.txt]
    walk:
      # Measured after the balcony-vomitory and private-stair repair. Both the main
      # lounge floor and upper gallery must return all the way to the forecourt.
      - from: [-354, 68, -498]
        pad: 30
        both_ways: true
        to: [[-408, 36, -560], [-410, 41, -560]]
      # Current fresh-snapshot coverage is 96% (192/199 standable cells).
      - from: [-354, 68, -498]
        box: [-417, 36, -566, -400, 42, -550]
        pad: 30
        min_coverage: 90

  # ---------------------------------------------------------- W4 western expansion
  # Built from the final archived designs after fitting their coordinates to the live
  # enlarged Westlight bowl and the measured lake shore.

  - name: westlight-district
    ops: [wd1_ground.txt, wd2_buildings.txt, wd3_waterfront.txt, wd4_final.txt]
    placement_ops: [wd4_final.txt]
    walk:
      # Gatehead reaches the stadium, both anchors, all seven shop plots, the public
      # pavilions, park/shore, and the boardwalk fitted outside the enlarged bowl.
      - from: [-344, 68, -486]
        pad: 35
        both_ways: true
        to:
          - [-354, 68, -498]       # stadium public entrance
          - [-380, 68, -476]       # High Street
          - [-332, 68, -484]       # Ferry Bell
          - [-326, 68, -505]       # Lantern Hall
          - [-400, 68, -465]       # shops A
          - [-393, 68, -465]       # B
          - [-386, 68, -465]       # C
          - [-379, 68, -465]       # D
          - [-370, 68, -465]       # E
          - [-362, 68, -465]       # F
          - [-355, 68, -465]       # G
          - [-394, 68, -490]       # Field House
          - [-416, 68, -480]       # Beacon Inn
          - [-344, 68, -455]       # Malt & Lantern
          - [-280, 68, -486]       # Shorelight Park / baths
          - [-280, 68, -507]       # Skiff House
          - [-282, 68, -535]       # Brimside boardwalk

  - name: approach-road
    ops: [ar1_road.txt, ar2_final.txt]
    placement_ops: [ar2_final.txt]
    walk:
      # Ravensgate road columns -> Millstone -> Panorama -> White Bridge -> Gatehead.
      - from: [-148, 68, -500]
        pad: 12
        both_ways: true
        to:
          - [-170, 72, -506]
          - [-224, 70, -496]
          - [-305, 73, -497]
          - [-322, 68, -497]
          - [-344, 68, -486]

  - name: ravensgate
    ops: [rg1_civic.txt, rg2_park.txt, rg3_final.txt]
    placement_ops: [rg3_final.txt]
    walk:
      # Town lane -> Bell-Gate -> Garth/library -> belvedere -> Long Water ->
      # tempietto and western handoff.
      - from: [-108, 68, -421]
        pad: 40
        both_ways: true
        to:
          - [-108, 68, -430]
          - [-85, 68, -440]
          - [-114, 68, -438]
          - [-85, 71, -452]
          - [-90, 68, -470]
          - [-130, 68, -498]
          - [-85, 70, -556]

  - name: ravenrock-connectivity
    ops: [fix18_ravenrock_access.txt]
    walk:
      # The earlier "closest approach 90 blocks" result bounded the search to
      # target_y +/- 10, excluding both the y=-12 connection and the route's westward
      # detour through Cavern A at x=75. It also targeted a non-standable cell one
      # block above the N5 tread. The built route is N9 shaft -> S1 -> Cavern A -> T3
      # -> N5. The final two-block repair extends the ladder to the surface walking
      # level and opens its east railing so the same route works in reverse.
      - from: [194, 65, -15]
        to: [[285, 19, -30]]
        pad: 130
        both_ways: true

  # ---------------------------------------------------------------- retired
  - name: town-concert-hall
    ops: [ch1_site.txt, ch2_bowl.txt, ch6_canopy.txt]
    retired: >
      Built at x=-85 z=-513, then demolished 2026-07-26 when the stadium moved west
      to Westlight. dm1_oldstadium.txt cleared the site back to flat grass at y67.

  - name: town-concert-hall-fitout
    ops: [ch3_seats.txt, ch4_canyons.txt, ch5_screen.txt, ch7_plaza.txt]
    retired: >
      NEVER RAN. A sequencer waited on `pgrep -f "buildops/ch2_bowl"`, which matched
      its own command line, so it waited on itself forever and nothing behind it
      started. Superseded by the Westlight bowl rather than restored.

  - name: members-club
    ops: [cl1_backstage.txt, cl2_hiddenway.txt, cl3_club.txt]
    retired: >
      NEVER RAN, same deadlock. Rebuilt inside wl1_theatre.txt as the theatre's
      premium box lounge off the balcony's west side.

  - name: central-pavilion
    ops: [pav1.txt]
    retired: >
      Demolished 2026-07-26 and superseded by Ravensgate: Garth, south stoa, library
      loggia, 42-block Bell-Gate campanile, belvedere, Long Water and western park.

  - name: westlight-bowl-mix
    ops: [wl2_bowl_worldedit.txt]
    walk_na: material scatter over already-checked geometry
