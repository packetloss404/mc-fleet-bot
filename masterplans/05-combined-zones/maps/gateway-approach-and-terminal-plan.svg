  <title id="title">Z02 Gateway Approach and Empty Eight terminal plan</title>
  <desc id="desc">Layer-separated planning diagram showing the landscaped Gateway Approach, two surface passenger stops, concealed subway junction and descent, and the eight-track eight-platform Gateway Expansion Terminal.</desc>
