[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcwb"
version = "0.0.1"
description = "Minecraft world builder from versioned masterplans"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ian Walmsley" },
]
keywords = ["minecraft", "world-builder", "amulet", "litematic", "masterplan"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "jsonschema>=4.21",
    "litemapy>=0.11.0b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
amulet = [
    # Opt-in. The build pipeline auto-detects amulet-core and uses it
    # when available. Currently requires Python 3.11 or 3.12; the
    # amulet-nbt 1.0.3.x series has a dataclass mutable-default
    # incompatibility with Python 3.13.
    "amulet-core>=1.6",
    "amulet-nbt>=1.0.3",
]

[project.scripts]
mcwb = "mcwb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mcwb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
