# DyoBot Sidecar Configuration

api:
  port: 3001
  # Bound to loopback: every /api/* route is unauthenticated unless
  # DASHBOARD_AUTH_SECRET is set, and the LLM provider routes expose provider
  # config. Nothing off-host legitimately calls this API — the dashboard's
  # browser bundle already targets http://localhost:3001 (NEXT_PUBLIC_API_URL
  # is unset), so it was never reachable cross-host anyway. Use an SSH tunnel
  # for remote access rather than reopening this to 0.0.0.0.
  host: "127.0.0.1"

minecraft:
  host: "10.80.13.14"
  port: 25565
  version: "1.21.11"
  auth: "offline"
  # Onboarding behaviour. DyoCraft uses a chat-password login + a class-select
  # hotbar dance; a vanilla/Paper server needs neither (loginFlow: "none",
  # selectClass: false). Changing minecraft.* requires a dyobot restart to
  # reconnect — the values are only read at connect time.
  loginFlow: "none"        # "none" | "dyoauth"
  loginPassword: "dyobot2026"
  selectClass: false

bots:
  maxBots: 10
  defaultMode: "codegen"
  # Gentle on the server's connection rate-limiter: a wide join stagger + long
  # reconnect delay keeps 8 bots from hammering logins (which trips the server
  # into refusing logins fleet-wide). Raised after a churn-induced login
  # rate-limit on 2026-05-25.
  joinStaggerMs: 45000
  reconnectDelaySec: 60
  maxReconnectAttempts: 1000
  # Slow retry cadence when the server rejects our protocol version
  # ("Outdated client!") — e.g. DyoCraft on Paper 26.2 vs our 1.21.11 stack
  # (2026-07-24). Permanent until the server adds ViaBackwards or mineflayer
  # learns the server's version, so retry as a 15-min heartbeat instead of
  # the normal 30s storm. Doesn't consume maxReconnectAttempts.
  versionMismatchBackoffSec: 900

behavior:
  headTrackingRange: 10
  headTrackingTickMs: 250
  wanderRadius: 15
  wanderIntervalMs: 5000
  ambientChatMinSec: 120
  ambientChatMaxSec: 300
  conversationRadius: 64.0

affinity:
  default: 50
  hitPenalty: 10
  chatBonus: 2
  giftBonus: 5
  negativeSentimentPenalty: 3
  hostileThreshold: 20
  trustThreshold: 70

instincts:
  enabled: true
  attackCooldownMs: 12000
  lowHealthThreshold: 8
  fleeDistance: 14
  fightRange: 3
  drowningOxygenThreshold: 120
  drowningSurfaceClearOxygen: 260

voyager:
  enabled: true
  taskCooldownMs: 2000
  maxRetriesPerTask: 3
  codeExecutionTimeoutMs: 300000
  curriculumLLMCalls: true
  criticLLMCalls: true

llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  temperature: 0.7
  chatMaxTokens: 2048
  # 16384 (was 8192): the codegen brain (MiniMax-M3) is a chain-of-thought model
  # that spends output tokens on reasoning BEFORE emitting the code block. At 8192
  # the reasoning+code routinely truncated mid-function → "Unterminated template" /
  # maxTokens failures. Doubling the cap lets the full function land.
  codeGenMaxTokens: 16384
  maxConcurrentRequests: 1

skills:
  directory: "./skills"
  maxSkills: 500

logging:
  level: "debug"

# Followup #58 — player-identity session.
#   devSecret: when set, POST /api/auth/login requires this string as
#     the `secret` body field and accepts it for ANY playerName. The
#     login mints a signed `pid` cookie that requireMayor validates
#     against the town's mayor.playerName.
#   Leave commented out (or set to null) for local-dev mode where any
#     playerName logs in successfully. Per-player secrets are a future
#     followup; today this is a single shared key.
auth:
  devSecret: null

# Impersonation detection — defends against another client logging in under a
# bot's username (which kicks the real bot via duplicate-login). On detection
# the bot quarantines itself (stops reconnecting) and an alert is raised on the
# dashboard, the log, and — if configured — in-game chat and a webhook.
#   impersonationDetection: master switch (default ON).
#   broadcastInGame: have a connected bot warn in Minecraft chat (visible to
#     the attacker by design).
#   quarantineReleaseSec: reserved; 0 = manual release only
#     (POST /api/bots/:name/quarantine/release).
# Webhook URL is set via the IMPERSONATION_ALERT_WEBHOOK env var, not here.
security:
  impersonationDetection: true
  broadcastInGame: true
  quarantineReleaseSec: 0

# Project Sid P2 — "Governance that bites". When enabled, a mayor decree is
# ALSO persisted as a standing TownRule (data/town_rules.json) and
# BlackboardManager boosts tasks whose text/keywords match an active rule for
# the bot's town, so decrees keep shaping behavior instead of being one-shot.
#   enabled: master switch (default OFF — behavior-changing). When false,
#     decrees keep their legacy one-shot-task behavior and task scores are
#     identical to today (the rule store is never consulted).
governance:
  enabled: true

# Project Sid P3 — "Culture & social spread".
#   botAffinity: master switch for bot->bot affinity edges (P3-A). When ON,
#     bots derive a CHEAP, non-LLM sentiment from each inter-bot message they
#     process (message kind + keyword scan) and nudge a directed bot->peer
#     affinity edge via the existing affinity store. Top bot-relationships are
#     surfaced in the chat prompt, and a disliked peer (below the affinity
#     hostile threshold) is deprioritized for help/resource sharing. Default
#     OFF — when false, inter-bot messages behave exactly as before with no
#     affinity edges and no added LLM cost.
#   culture: master switch for the P3-B cultural-meme layer (CultureManager).
#     When ON, memes EMERGE from recurring inter-bot chatter (cheap keyword
#     frequency, no LLM), a bot ADOPTS a meme it hears from a TRUSTED peer
#     (bot->bot affinity at/above affinity.trustThreshold), and adopted memes
#     BIAS BEHAVIOR — they flavor ambient chat AND are injected into the bot's
#     task/goal prompt (so culture changes what bots do, not just what they
#     say). Memes propagate via BotComms.broadcast(). See GET /api/culture for
#     per-town meme curves. Default OFF — when false the worker never wires the
#     culture proxy, so there is zero behavior change and zero added LLM cost.
social:
  botAffinity: true
  culture: true

# Project Sid P4 — "PIANO cognition".
#   perceptionTick: master switch for the always-on perception tick (P4-A).
#     When ON, the threat/opportunity/survival-goal assessors run on their own
#     short-interval timer (~750ms, like the instinct loop) and write results
#     into a per-bot AgentState cache; VoyagerLoop.runOneCycle READS that cache
#     instead of computing inline, so a threat that spawns mid-task is perceived
#     before the next cycle's inline scan would have caught it. Default OFF —
#     when false the perception timer is never started and runOneCycle computes
#     the assessment inline byte-for-byte as today (cache never consulted, zero
#     added timer/CPU cost).
#   cognitiveController: reserved for the P4-B CognitiveController + decision
#     broadcast (replaces the imperative priority ladder). Default OFF.
cognition:
  perceptionTick: false
  cognitiveController: false

# Build-system tuning knobs.
#   sitePrepTimeoutMs: hard deadline for the pre-job phase of startBuild
#     (origin resolution, bunker excavation, site-clear, snap-to-ground).
#     If this budget elapses the call rejects so the TownBrain serialized loop
#     is never wedged indefinitely by a hung site-prep operation.
#     Default 150000 (2.5 min) — generous enough for a loaded 2-core host.
build:
  sitePrepTimeoutMs: 150000

# Mining geofence — keeps bots from tunnelling through town structures to gather
# raw materials, and routes resource mining to a single communal mine site.
# Consumed by src/actions/geofence.ts (read once per worker; fail-open if absent
# or unreadable, so mining never breaks just because this section is missing).
mining:
  # Axis-aligned protected boxes around known builds. mineBlock refuses to dig
  # any block inside these zones, so bots can't chew into roads / houses / the
  # town hall. Coordinates are generous bounding boxes around each build cluster.
  # Emptied 2026-07-24 on the repoint to the fresh server (10.80.13.14): every
  # box described the old DyoCraft world, 800-1730 blocks from this world's
  # spawn at (-9,76,-10). They were live-misbehaving — protected zones double as
  # the night-shelter target (getNearestProtectedCenter, geofence.ts) so bots
  # were being sent on ~875-block marches to sam-cottage-829, a town that does
  # not exist here. Empty list = nothing protected, no shelter target; bots
  # build their own hut at night. Repopulate as this world gets built.
  #
  # REPOPULATED 2026-07-24: Worker Town ("Ravensreach") now exists north of the
  # MSA/Raven Rock envelope, and its Town Hall is the fleet's muster point.
  #
  # NOTE ON minY — 43 is deliberate, not a typo. getNearestProtectedCenter
  # (geofence.ts) returns the zone centre at y = minY + 24, and that value is
  # handed to GoalGenerator as the night shelter target. The hall plaza is at
  # y67, so minY must be 43 to aim bots at the ground. Setting minY to the
  # "obvious" 60 would march them to y84 — well above the roof.
  #
  # The box also makes every block inside undiggable (enforced at the mineBlock
  # filter, the bot.dig hook, and the build engine's /fill paths), which is what
  # stops the hall being mined out from under itself.
  # EXTENDED 2026-07-25 per docs/DECISIONS-2026-07-25.md (Ravensreach Q7). The
  # 2026-07-25 world audit found every structure except the hall was undiggable by
  # nobody: 5 cottages, the storehouse and the mine apron had no zone at all, and
  # bots demonstrably act on nearby materials (9 of 17 grove trees were harvested).
  # Boxes are the as-built footprints from town.db plus a 2-block margin.
  #
  # ONLY the hall carries `shelter: true`. getNearestProtectedCenter returns the
  # NEAREST zone centre as the night-shelter target, so marking several would
  # scatter the fleet across the town at dusk instead of mustering it at the hall.
  #
  # The mine is protected at its APRON ONLY (y63-70: the 9x9 stone_brick pad, the
  # collar and the torch ring). The shaft interior y58-62 is deliberately left
  # diggable — a mine that cannot be dug is not a mine, and the decision protects
  # the apron, not the resource.
  #
  # Accepted trade-off, stated in the decision: bots also cannot REPAIR anything
  # inside these boxes. That is moot while all repair work is operator-RCON.
  #
  # NOTE: this list cannot be hot-patched. FIELD_TYPES.mining types only minDigY,
  # and validatePatch silently DROPS arrays while returning ok:true — a PATCH here
  # reports success and changes nothing. Editing this file plus a restart is the
  # only path.
  protectedZones:
    - name: ravensreach-town-hall
      minX: -105
      minY: 43
      minZ: -395
      maxX: -65
      maxY: 95
      maxZ: -355
      shelter: true
    - name: ravensreach-cottage-architect
      minX: -126
      minY: 60
      minZ: -382
      maxX: -110
      maxY: 85
      maxZ: -368
    - name: ravensreach-cottage-mason
      minX: -60
      minY: 60
      minZ: -382
      maxX: -44
      maxY: 85
      maxZ: -368
    - name: ravensreach-cottage-surveyor
      minX: -93
      minY: 60
      minZ: -409
      maxX: -77
      maxY: 85
      maxZ: -398
    - name: ravensreach-cottage-steward
      minX: -120
      minY: 60
      minZ: -352
      maxX: -104
      maxY: 85
      maxZ: -338
    - name: ravensreach-cottage-scout
      minX: -66
      minY: 60
      minZ: -352
      maxX: -50
      maxY: 85
      maxZ: -338
    - name: ravensreach-storehouse
      minX: -97
      minY: 60
      minZ: -422
      maxX: -73
      maxY: 80
      maxZ: -406
    - name: ravensreach-mine-apron
      minX: -91
      minY: 63
      minZ: -446
      maxX: -79
      maxY: 70
      maxZ: -434
  # Dig-depth floor. Bots default to tunnelling straight down whenever a surface
  # resource isn't immediately visible, then get entombed: on 2026-07-24 the
  # fleet was found at y14/y35/y52/y61 with solid blocks overhead, and "Mine 1
  # oak log" had been attempted 4,357 times at a 2% pass rate — there are no
  # trees at y14. mineBlock now refuses any dig below this Y outside the mine
  # site. 50 leaves ~14 blocks of headroom under the y64 surface for
  # foundations, cellars and shallow coal/iron, while making runaway descent
  # impossible. Unset this to restore the old (unbounded) behaviour.
  minDigY: 50
  # Excavation Y-CEILING for the Raven Rock carving campaign (OQ-4).
  #
  # The mirror of minDigY above: that stops bots digging too DEEP, this stops
  # them cutting too HIGH. Raven Rock sits beneath MainStreet America with a
  # 22-block greenstone buffer (y41->y61) between its cavern ceilings and MSA's
  # y62 foundation. A bot carving a cavern roof or a tunnel that strays above
  # y41 thins or breaches that buffer under a live surface build.
  #
  # DISABLED BY DEFAULT, and it must stay that way except while carving. With
  # enabled: true nothing may edit a block above y41 outside the exempt boxes --
  # which would forbid MSA surface work at y64 and the Ravensreach hall at y67,
  # i.e. nearly everything currently standing. Turn it on for the duration of
  # the Raven Rock dig, then turn it back off.
  #
  # The exempt box is the RR-Z5 vertical shaft, the single sanctioned breach.
  # These are the RELOCATED (OQ-1) coordinates. Several documents still show the
  # superseded x[113,127], z[53,67] -- wiring those would whitelist empty rock
  # and refuse the real shaft.
  carveCeiling:
    enabled: false
    maxY: 41
    exempt:
      - name: rr-z5-shaft
        minX: 193
        maxX: 207
        minZ: -22
        maxZ: -8
      # The four portal-approach corridors (OQ-6). Added 2026-07-24 with
      # sign-off, after the portal survey showed OQ-4 and OQ-6 could not both
      # hold as written: every portal floor is at y18, but the surveyed surface
      # above the mouths runs y62-y79, so there is no natural rock face and
      # making one means cutting down through y41.
      #
      # This EXTENDS the exemption rather than weakening the rule. The buffer
      # OQ-4 defends sits under MainStreet America; all four mouths are at the
      # +-285/-290 envelope edge, 150+ blocks clear of it, so these carve-outs
      # protect nothing less. Boxes match the reserved no-build corridors in
      # MSA's site-plan.md Z08-R exactly.
      - name: n3-south-portal-approach     # relocated per OQ-8 to x=-150
        minX: -165
        maxX: -135
        minZ: 270
        maxZ: 300
      - name: n4-north-portal-approach
        minX: -15
        maxX: 15
        minZ: -300
        maxZ: -270
      - name: n5-east-portal-approach
        minX: 270
        maxX: 300
        minZ: -45
        maxZ: -15
      - name: n6-west-portal-approach
        minX: -300
        maxX: -275
        minZ: -10
        maxZ: 20
  # Communal mine site: bots walk here before mining any routed block type, then
  # dig down/out AT the site instead of wherever they happen to be standing.
  # Unset since the repoint — the old site (1720,64,194) is ~1730 blocks from
  # spawn, and routing there failed every ore task. With no mineSite configured
  # the routing below is inert and bots mine ore wherever they find it. Set this
  # once a communal mine exists in this world:
  # Set 2026-07-24 alongside minDigY: with a depth floor in force, deep
  # extraction (diamonds, deepslate ores) needs ONE sanctioned place or ore
  # tasks would fail everywhere. Sited east of the oak grove planted at
  # x18-50/z42-54 so mining never eats the trees, and inside the y64 shelf the
  # bots can actually path to. Digs inside this radius bypass the floor.
  # FLIPPED NORTH 2026-07-25. The fleet now lives at Ravensreach (-85,67,-375)
  # with cottages, a storehouse and a plaza, so the southern site beside MSA had
  # become the ~450-block trek this setting exists to prevent. mineSite is
  # SINGULAR (geofence.ts types it MineSite | null), so this is a move, not an
  # addition -- MSA-area ore tasks now travel instead. The southern mine and
  # grove remain in the world at (80,64,42) / x18-50 z42-54 if it needs reverting.
  mineSite:
    x: -85
    y: 64
    z: -440
    radius: 20
  # Raw block types that must be sourced at the communal mine, not in town.
  # NOTE: bulk building materials (stone, cobblestone, dirt, gravel, the andesite/
  # diorite/granite/tuff/deepslate family) were REMOVED from this list so build
  # crews gather them locally instead of trekking to the communal mine at
  # 1720,64,194 for every load — that round-trip was a big chunk of the "bots
  # endlessly underground" behaviour. Protected zones are still enforced
  # independently at the bot.dig choke point (isProtected), so dropping these from
  # routing does NOT let bots dig up town. Only true ORES remain routed, to keep
  # ore extraction centralised at the communal site.
  routeToMineBlocks:
    - coal_ore
    - iron_ore
    - copper_ore
    - gold_ore
    - redstone_ore
    - lapis_ore
    - diamond_ore
    - emerald_ore
    - deepslate_coal_ore
    - deepslate_iron_ore
    - deepslate_copper_ore
    - deepslate_gold_ore
    - deepslate_redstone_ore
    - deepslate_lapis_ore
    - deepslate_diamond_ore
    - deepslate_emerald_ore

# Per-bot movement leash. Pins a named bot to a home anchor (x,z) + radius:
# generated code can't move it outside the radius (CodeExecutor.moveTo rejects
# outward targets; exploreUntil is disabled for it). Keeps a caretaker bot on
# its island/site. Adjust radius to the island size.
# Emptied 2026-07-24 on the repoint: the Eleven (1559,-392) and Sam (1663,194)
# anchors were old-world coordinates. A leash is enforced from spawn onward, so
# spawning either name would have stranded the bot permanently — it could never
# walk to an anchor ~1600 blocks outside its own leash radius.
leash: []

# Safe fallback spot a stranded bot self-teleports to when stuck in liquid and
# unable to complete tasks (VoyagerLoop.tryRescueIfStranded). Unset since the
# 2026-07-24 repoint — the old value (1559,65,-392) was the DyoCraft island HQ,
# ~1600 blocks from this world. With it absent, unleashed bots escalate a WARN
# instead of auto-rescuing. Point it at this world's capital once one exists.
# rescueHome:
#   x: 0
#   y: 64
#   z: 0
