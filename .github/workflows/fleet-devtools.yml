name: fleet-devtools

# Promoted from fleet-devtools/.github/workflows/ci.yml on 2026-08-07, when
# mc-fleet-devtools was merged in as a subtool.
#
# WHY THIS MOVED: GitHub only reads workflows from `.github/workflows/` at the
# REPOSITORY ROOT. Left where it was, the file would still look live in the
# tree while never running again — a silently dead gate, which is worse than
# no gate. See fleet-devtools/.github/workflows/ci.yml, kept as a pointer.
#
# WHY IT IS SCOPED: `.github/workflows/ci.yml` now gates the buildable
# fresh-clone application contract. The full root suite still includes
# source-bound test/build cases that read gitignored data/world-review
# evidence, so those remain operator-host checks. This workflow stays narrow:
# it triggers only on fleet-devtools changes and runs the subtool's own gate.

on:
  push:
    branches: [main]
    paths:
      - 'fleet-devtools/**'
      - '.github/workflows/fleet-devtools.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fleet-devtools/**'
      - '.github/workflows/fleet-devtools.yml'

permissions:
  contents: read

concurrency:
  group: fleet-devtools-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fleet-devtools

jobs:
  check:
    name: Build, lint, test, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # The subtool has its own lockfile; without this the cache action
          # looks for one at the repo root and caches the wrong project.
          cache-dependency-path: fleet-devtools/package-lock.json

      - name: Install
        run: npm ci

      # These four are `npm run check` (build && lint && test && format:check),
      # split into separate steps so a failure names its own stage instead of
      # dumping a compound && failure.
      #
      # The original workflow ran build + test only. fleet-devtools' README,
      # AGENTS.md and docs/ROADMAP.md all assert CI runs `npm run check` — four
      # documented claims against one workflow. The drift is chronological, not
      # deliberate: ci.yml has exactly one commit in its history (6c6756b) and
      # Prettier arrived later (aaf22d6), so `format:check` did not exist when
      # CI was written and CI was never revisited. The docs describe the
      # intended contract, so the workflow is brought up to them rather than
      # the docs quietly corrected down.
      - name: Build packages and apps
        run: npm run build

      # Workspace package exports point at dist/*.d.ts, so the package build
      # must precede the aggregate root type-check on a clean checkout.
      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check
