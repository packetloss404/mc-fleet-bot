name: application-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # test/build is intentionally not folded into this gate. Most of that
      # suite validates immutable world snapshots under data/world-review,
      # which are operational evidence and are intentionally not in Git.
      - name: Test core application
        run: >-
          npx vitest run
          src
          test/actions
          test/ai
          test/bot
          test/control
          test/integrations
          test/personality
          test/security
          test/server
          test/social
          test/supplychain
          test/survival
          test/town
          test/util
          test/voyager
          test/worker
          test/world

  dashboard:
    name: Dashboard lint, unit, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  world-builder:
    name: World Builder tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world-builder/pyproject.toml

      - name: Install
        run: python -m pip install -e './world-builder[dev]'

      - name: Test
        run: python -m pytest world-builder/tests

  world-showcase:
    name: World Showcase publication and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: world-showcase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: world-showcase/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify published report integrity
        run: npm run test:publication

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build and real-browser showcase tests
        run: npm run test:e2e

      - name: Upload showcase browser-test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-showcase-playwright-report
          path: world-showcase/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
