      agency, two restaurants (incl. MAIN Restaurant), and a culinary school (The Main Course / Main Course
      Cooking School). Visitors paid admission (~$10 adult) and carried a handheld "T.E.D." (Technological
      Educational Device — Google Nexus 7 tablets that scanned RFID product tags). Featured brands included
      Kohler, GE, Bosch, Electrolux, Moen, Daltile, Kent Moore Cabinets, PPG, California Closets, Toto.

