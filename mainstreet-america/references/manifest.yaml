    confidence: verified
    observations: >-
      A ~$20 million model-home park and home-design/retail destination on I-45 in Spring, marketed as a
      "home-improvement theme park." 12 uninhabited model homes ("The MainStreet American Home Collection")
      doubled as working retail showrooms for appliances, cabinetry, fixtures, and flooring. Bundled ~10
      integrated Feigin-owned businesses: custom home building (Design Tech Homes), remodeling (MainStreet
