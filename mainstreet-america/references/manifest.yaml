# MainStreet America (Spring, TX) — Reference Manifest
# Subject: the former MainStreet America home-design attraction / model-home park
#   18750 Interstate 45 N, Spring, Texas 77373 (Greater Houston, Harris County). Now closed.
# Purpose: authoritative, honestly-labeled source record for a Minecraft reconstruction.
# Confidence vocabulary (never upgraded across this file):
#   verified                          - multiple independent sources, or a primary source
#   high-confidence inference         - one good source or a strong read, not independently confirmed
#   moderate-confidence reconstruction- assembled from snippets / unlabeled imagery
#   creative approximation            - no evidence; the build must invent it

research_summary:
  verdict: >-
    Strong evidence exists. This was NOT a dead end. MainStreet America was a well-documented,
    real ~$20 million commercial attraction, and the analysts recovered genuine primary sources:
    (1) the property owner's own site and a marketing case study naming the developer;
    (2) contemporaneous 2013 press (CultureMap, OutSmart Magazine, Community Impact, TourTexas);
    (3) a primary commercial real-estate offering — the Colliers International FOR SALE flyer (c.2018-2020)
    with an annotated aerial and a hard spec table (exact building square footages, acreage, year built,
    parking), corroborated by a TenantBase listing and LoopNet summaries;
    (4) MainStreet America's OWN "Showcase of Homes" pages recovered from the Wayback Machine
    (2013 captures, corroborated by 2017 captures) giving verified names, styles, square footages and
    bed/bath/story counts for ALL 12 model homes;
    (5) a 2025 ABC13 Houston news report on the property's current vacant/vandalized condition.
    The core history — Feigin family / Design Tech Homes as developer, opened February 2013 (structures
    built 2011), 12 model homes, ~44,019 SF two-story guest center — is solidly verified.
  what_is_well_established:
    - Developer, concept, cost, and February 2013 opening.
    - The full 12-home roster: names, architectural styles, and per-home square footages.
    - The site's building program and dimensions (guest center, retail/cooking-school building,
      warehouse, 12 model homes, parking) from a primary real-estate document.
    - The overall site orientation and front-to-back functional layout (from an annotated aerial).
    - That the business has closed and the buildings were still standing (vacant, vandalized) as of Oct 2025.
  what_is_weak_or_missing:
    - The EXTERIOR APPEARANCE and construction materials of the guest center and each individual home.
      The real-estate docs give only square footage/stories; the flyer's renderings/photos could not be
      extracted as text or visually verified. Any facade material, color, or roof detail in the build is a
      creative approximation.
    - The precise physical position of each named home along the internal street (no site plan mapping
      home->lot was recovered).
    - Post-2023 disposition: buyer identity, sale price, and definitive 2026 status are unknown.
    - The "why" of closure rests on the company's own 2023 self-description (a strategic pivot), not
      independent reporting.
  bottom_line: >-
    A faithful reconstruction of the SITE LAYOUT, BUILDING FOOTPRINTS/SIZES, HOME ROSTER and STYLES is
    achievable from verified sources. The three-dimensional APPEARANCE of the buildings is largely
    reconstruction/approximation and must be labeled as such to visitors. Do not present invented facades
    as documented fact.

