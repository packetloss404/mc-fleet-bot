assumptions:
  - id: L01
    topic: No brief / no "section 17"
    detail: >-
      The location record and its alias set are authored from the manifest + coordinates.yaml, not
      transcribed from a section 17 (which does not exist). Same gap as coordinates.yaml CONFLICT-02.
    severity: high
  - id: L02
    topic: World name unconfirmed
    detail: >-
      'world' is a placeholder for the DyoCraft overworld name. Must be confirmed against the live
      server before this record (and warps.yaml / worldguard.yaml / map-marker.yaml) is applied.
    severity: medium
  - id: L03
    topic: Coordinates inherited, not re-derived
    detail: >-
      All key_coordinates are copied verbatim from planning/coordinates.yaml so every integration file
      collides-checks against the same numbers. Their XZ is creative approximation per that file.
    severity: low
