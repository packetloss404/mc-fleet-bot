#
# STATUS (rewritten 2026-07-25): **PARTLY APPLIED.** Everything the old status line said was wrong:
#   WorldEdit 7.4.0 and WorldGuard 7.0.16 ARE installed, and the builder bots ARE opped (level 4).
#   The overworld is named `world` (resolves WG02). What is LIVE on the server right now:
#
#     region  mainstreet_america   x[-70,70] y[62,319] z[-235,200]   priority 10   mob-spawning: deny
#
#   Deltas from the definition below, and why:
#     * BOUNDS NARROWED to MSA's developed band. The ±300 / y−64→320 envelope below would have blanketed
#       Raven Rock's whole subsurface and MSA's own perimeter under MSA's flags. The subsurface column is
#       instead owned by `raven-rock/integration/worldguard.yaml`'s `raven_rock` region (y ≤ 61), and the
#       Ravensreach settlement (x[-140,-30] z[-430,-310]) by a separate `ravensreach` region. Together the
#       three tile the space with no gap and no overlap.
#     * y max is 319, NOT 320. 320 is out of range in a 1.21 overworld (build limit is y=319).
#     * ONLY `mob-spawning: deny` is set — that is OQ-3's second half. Every other flag below, in
#       particular build / block-break / block-place, is STILL UNSET **on purpose**: opped players bypass
#       WorldGuard build protection, so applying them now would protect nothing while giving a false
#       impression that the site is guarded. They are the OQ-2 step and must be applied AFTER the de-op.
#   See raven-rock/qa/oq3-worldguard.md for the applied commands and the verification output.
#
# -----------------------------------------------------------------------------------------------------
# PROVENANCE / HONESTY NOTE  (read before trusting the flags)
# -----------------------------------------------------------------------------------------------------
# The task cited "exactly the flags given in section 18." NO brief and NO "section 18" exist in this
# repository (only ../references/manifest.yaml + ../references/README.md + planning/). This is the same
# missing-brief gap recorded as coordinates.yaml CONFLICT-02 / palettes.yaml A01. I therefore AUTHORED
# the flag set below — a sensible "curated public showcase" profile (visitors may walk through and use
# doors, but cannot build/grief, and the environment is kept calm) — rather than transcribing a section
# that does not exist. Treat the flag SET as reasoned construction, not a canonical transcription.
# All flag NAMES and VALUES below are real WorldGuard state flags (WorldGuard 7.x).
# =====================================================================================================

# The region spans the full 600x600 project envelope (site-plan.md §1: X/Z in [-300, +300]) across the
# full 1.21 world height. type: cuboid, min -> max inclusive.
regions:
  mainstreet_america:
    type: cuboid
    priority: 10
    min:
      x: -300
      y: -64        # 1.21 world floor
      z: -300
    max:
      x: 300
      y: 320        # 1.21 world ceiling
      z: 300

    # --- FLAGS (authored; see provenance note) ----------------------------------------------------
    # Intent: a walk-through museum/showcase. Non-members cannot alter the build; visitors may enter,
    # move freely, and operate doors/gates; explosions, fire spread and hostile mobs are suppressed so
    # the reconstruction is not damaged or made hostile.
    flags:
      # Build / grief protection
      build: deny                # non-members cannot place or break anything
      block-break: deny
      block-place: deny
      interact: allow            # visitors CAN use doors, gates, buttons, trapdoors (showcase walk-through)
      chest-access: deny         # no container looting (there are no visitor chests, but deny by default)
      use: allow                 # levers/buttons/doors usable by visitors
      item-frame-rotation: deny
      # Combat / safety
      pvp: deny
      mob-damage: deny           # ambient mobs cannot hurt visitors
      damage-animals: deny
      # Environment preservation
      mob-spawning: deny         # keep the site clean of wandering mobs
      creeper-explosion: deny
      other-explosion: deny
      tnt: deny
      ghast-fireball: deny
      wither-damage: deny
      enderman-grief: deny
      fire-spread: deny
      lava-fire: deny
      lighter: deny              # no flint-and-steel ignition
      ice-form: deny
      ice-melt: deny
      snow-fall: deny
      snow-melt: deny
      vine-growth: deny
      # Movement / presence
      entry: allow
      exit: allow
      passthrough: allow
      # Signage shown at the boundary (honest framing for visitors)
      greeting: "&eWelcome to &6MainStreet America&e — a reconstruction of the former Design Tech Homes model-home park, I-45 Spring, TX. &7Layout & sizes are real; the buildings' look is our informed reconstruction."
      farewell: "&7Leaving MainStreet America. Thanks for visiting."

    # CORRECTED 2026-07-25: the bots ARE opped (level 4) and a live admin UUID DOES exist —
    # packetloss404 = dac51b37-928d-35f5-b87a-0fcabb26752a. owners/members are still empty on the live
    # region because seeding them grants nothing while the bots hold op. Seed them as step 2 of the OQ-2
    # sequence, i.e. BEFORE the de-op and before 'build: deny', or the de-op removes the last edit path
    # into the finished site. See ../../raven-rock/qa/oq3-worldguard.md §5.
    owners:
      unique-ids: []
      groups: []
    members:
      unique-ids: []
      groups: []

