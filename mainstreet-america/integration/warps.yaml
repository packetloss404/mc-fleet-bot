# =====================================================================================================
# MainStreet America — WARP DEFINITIONS  (integration/warps.yaml)
# =====================================================================================================
# REQUIRED PLUGIN: EssentialsX (the /warp system). Any Essentials-compatible warp plugin will do.
# STATUS: STAGED, NOT ACTIVE — EssentialsX is genuinely absent, as are Dynmap/BlueMap and Citizens, so no
#   /warp works today. CORRECTED 2026-07-25: the side-claims were FALSE — **WorldGuard 7.0.16 and
#   WorldEdit 7.4.0 ARE installed** and the **builder bots ARE opped (level 4)**; overworld name confirmed
#   `world`. Apply only once EssentialsX exists.
#   NOTE ON LAYOUT: EssentialsX stores each warp as its own file at
#   plugins/Essentials/warps/<name>.yml. This single file is a STAGING bundle of all five warps for
#   review; split it into per-warp files (keys under 'warps:' -> individual <name>.yml) at apply-time,
#   or feed it to a small importer.
#
# -----------------------------------------------------------------------------------------------------
# PROVENANCE / HONESTY NOTE
# -----------------------------------------------------------------------------------------------------
# Current south-arrival and Guest Center warps were reconciled on 2026-07-26 against the measured
# as-built geometry and world-map.db; the remaining tour anchors retain their declared N-series
# provenance. Absolute XZ is still a creative reconstruction of the real property. XZ values are
# centered on the block (+0.5); Y is the measured safe standing height for each destination.
#
# Minecraft yaw reference used for 'facing': 0=+Z(South), 90=-X(West), 180=-Z(North), 270=+X(East).
# =====================================================================================================

schema_version: 1
world_assumption: >-
  'world' is the live overworld name confirmed by RCON on 2026-07-25 and matches
  location.yaml / worldguard.yaml / map-marker.yaml.

# Visitor warps tracing the public journey plus direct hangar access.
warps:

  # 1) Arrival — the built south gate, looking down the terraced approach.
  mainstreet:
    source_notable_location: P01-SOUTH-ARRIVAL-CARRIAGE
    world: world
    x: 0.5
    y: 79.0
    z: 304.5
    yaw: 180.0            # face NORTH, toward the Guest Center / into the site
    pitch: 0.0
    label: "MainStreet America — South Gate / Arrival Gardens"
    confidence: high-confidence inference   # sequence known; exact block is placement (coordinates.yaml)

  # 2) Guest Center — the repaired formal south entrance facing the parking.
  msa_guestcenter:
    source_notable_location: B01 south-grand-entry
    world: world
    x: 0.5
    y: 65.0
    z: 168.5
    yaw: 180.0            # face NORTH, into the Guest Center's south door
    pitch: 0.0
    label: "MainStreet America — Guest Center"
    confidence: high-confidence inference

  # 3) Showcase Homes — the south mouth of the internal model-home street.
  msa_homes:
    source_notable_location: R01 south endpoint
    world: world
    x: 0.5
    y: 65.0
    z: 80.5
    yaw: 180.0            # face NORTH, up the street of 12 homes
    pitch: 0.0
    label: "MainStreet America — Showcase Homes"
    confidence: high-confidence inference

  # 4) Cul-de-sac — the dead-end terminus at the rear of the home street (verified street character).
  msa_culdesac:
    source_notable_location: R01 north endpoint
    world: world
    x: 0.5
    y: 65.0
    z: -235.5
    yaw: 0.0             # face SOUTH, looking back down the street over the homes
    pitch: 0.0
    label: "MainStreet America — Cul-de-sac"
    confidence: high-confidence inference

  # 5) Detention Pond — the naturalized rear water feature / scenic terminus.
  msa_pond:
    source_notable_location: N08 (Detention Pond)
    world: world
    x: 190.5
    y: 65.0
    z: -250.5
    yaw: 90.0            # face WEST, toward the site interior / across the water
    pitch: 0.0
    label: "MainStreet America — Detention Pond"
    confidence: moderate-confidence reconstruction   # pond is an unlabeled aerial read (REF-016)

  # 6) Mountain hangar — inside the west end of the operations complex.
  msa_hangar:
    source_notable_location: C01 hangarTarget
    world: world
    x: 150.5
    y: 63.0
    z: 110.5
    yaw: 270.0            # face EAST, down the lit ribbon toward the arena
    pitch: 0.0
    label: "MainStreet America — Mountain Hangar"
    confidence: creative approximation

# =====================================================================================================
# ASSUMPTIONS & CROSS-CHECK NOTES
# =====================================================================================================
assumptions:
  - id: WP01
    topic: Y offset +1
    detail: >-
      Notable_locations store y=64 (the build plane). Warp y is set to 65.0 so players stand on the
      surface. If the ground surface block actually occupies y=64 (top at y=65) this is correct; if the
      walkable surface is y=64, drop to 64.0. Verify against the finished terrain before apply.
    severity: low
  - id: WP02
    topic: Visitor and operations warps
    detail: >-
      The five original visitor-tour anchors are retained, with a sixth direct hangar anchor added
      after the 2026-07-26 access recovery. Warehouse, billboard, design studio, and T.E.D. point
      remain markers rather than warps.
    severity: low
  - id: WP03
    topic: World name + storage layout
    detail: >-
      'world' is confirmed. EssentialsX expects per-warp files under plugins/Essentials/warps/;
      split this bundle at apply-time.
    severity: low
