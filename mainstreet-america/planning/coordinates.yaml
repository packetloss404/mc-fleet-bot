# ---------------------------------------------------------------------------------------------------
# ORIGIN, SCALE, ORIENTATION, BOUNDARY
# ---------------------------------------------------------------------------------------------------
project:
  origin: {x: 0, y: 64, z: 0}          # world origin; y=64 is ground/build plane
  scale:
    horizontal_blocks_per_foot: 0.5     # 1 block ~= 2 real feet
    sqft_per_floor_block: 4             # 1 block^2 = 4 sqft (used for every footprint below)
    vertical_blocks_per_story: 5        # ~10 ft/story -> 5 blocks wall height (roof extra)
  orientation:
    north: "-Z"
    south: "+Z"
    east: "+X"
    west: "-X"
    frontage_road_side: "south"        # PROJECT CONSTANT. Principal entrance faces SOUTH (+Z).
    note: >-
      REORIENTATION APPLIED. The real parcel fronts WEST toward I-45 (REF-014). The project constant
      mandates the frontage/entrance on the SOUTH side, so the entire real west->east functional
      gradient is rotated to run SOUTH(front)->NORTH(rear) in this build:
      south +Z = frontage road / parking / guest center;  north -Z = homes street then warehouse rear.
      "West of the freeway" landmarks (billboard) are kept on the build's SW corner for internal
      consistency. This is a deliberate override, recorded as a conflict below.
  boundary:
    min: {x: -300, z: -300}
    max: {x: 300, z: 300}
    size_blocks: {x: 600, z: 600}
    note: >-
      600x600 blocks = 1200x1200 ft = ~33 acres of world envelope — intentionally larger than the real
      ~12.41-acre parcel (REF-005). The developed program occupies a central ~490(x) x 580(z) footprint;
      the surplus margin is landscaped buffer. Do NOT read the boundary as the parcel line.

entrance:
  # Principal SOUTH site entrance: drive off the frontage road, on axis, leading north into parking.
  coordinate: {x: 0, y: 79, z: 305}
  facing: south              # gateway opens toward the frontage road (+Z)
  confidence: high-confidence inference   # sequence known; exact block is placement choice
  note: >-
    Measured center of the built 21-wide south gate and terraced arrival. The Guest Center's own
    main door is a separate notable_location (faces south).

