# ---------------------------------------------------------------------------------------------------
# INTERNAL CONSISTENCY CHECK  (computed, not eyeballed)
# Rules: every footprint (14 buildings + the warehouse) must lie inside its zone AND inside the
# 600x600 boundary; no two footprints may overlap. Method: axis-aligned bounding-box test on
# center +/- size/2. Full results verified programmatically before writing this file.
# ---------------------------------------------------------------------------------------------------
consistency_check:
  method: axis-aligned bounding box; boxes = center.x +/- x_size/2, center.z +/- z_size/2
  containment_in_zone: PASS        # all 15 footprints fall within their assigned zone bounds
  containment_in_boundary: PASS    # all extents within x/z [-300, 300]
  pairwise_overlap: PASS           # no two of the 15 footprints intersect
  tightest_clearances:
    - between: [H09 Casa Lana, H10 Cross Creek]
      gap_blocks: 12
      axis: z
    - between: [H03 Ashby (z-span), Retail/Cooking B02]
      gap_blocks: 54
      axis: x
    - between: [H06 Wakefield northmost, Warehouse N01]
      gap_blocks: 19
      axis: z
    - between: [Guest Center B01 north face, nearest homes H01/H07]
      gap_blocks: 19
      axis: z
  extents_summary:
    x: {min: -213 (B02 west edge), max: 99.5 (H09/H10 east edge)}
    z: {min: -278.5 (Warehouse north edge), max: 300 (frontage zone / entrance drive)}
  notes: >-
    Home footprints are structure boxes only; real front/side yards are absorbed by the generous
    inter-lot gaps (>=12 blocks) and the street corridor. All homes sit clear of the x[-25,25] street.

# ---------------------------------------------------------------------------------------------------
# CONFLICTS DETECTED  (recorded, not silently resolved)
# ---------------------------------------------------------------------------------------------------
conflicts_detected:
  - id: CONFLICT-01
    topic: Requested "fourteen buildings" vs fifteen source-faithful structures
    detail: >-
      The verified manifest yields 15 structures: 12 model homes + Guest Center + Retail/Cooking School
      + Warehouse. Producing exactly 14 buildings requires reclassifying one. I refused to drop any
      verified structure or to fall back to the disputed "11 homes" figure (which the manifest
      explicitly overrides with "use 12"). RESOLUTION: the Warehouse (Building 3) — the only non-public,
      back-of-house structure — is listed under notable_locations (N01) rather than buildings, while
      still carrying a full, overlap-checked footprint. Net geometric fidelity: zero loss. If a real
      brief defines a specific set of 14, my composition may differ from it.
    severity: medium

  - id: CONFLICT-02
    topic: No brief / no "section 17" exists
    detail: >-
      The task cited "the brief" and "section 17" for zones and notable_locations, but no brief file is
      present in the repo (planning/ was empty; only references/manifest.yaml + README.md exist). The
      nine zones and nine notable_locations here are my authored construction from the manifest, not a
      transcription. Cross-checking agents should treat the zone/notable SET as reasoned, not canonical.
    severity: high

  - id: CONFLICT-03
    topic: Orientation override (real WEST-facing site vs project-constant SOUTH frontage)
    detail: >-
      REF-014 places the real entrance facing WEST toward I-45. The project constant fixes frontage on
      the SOUTH. I rotated the whole functional gradient to run south(front)->north(rear) and kept the
      billboard on the SW corner. This is an intentional, documented divergence from the source aerial's
      true compass orientation — bearings here are build-space, not real-world azimuths.
    severity: low

  - id: CONFLICT-04
    topic: World boundary (~33 acres) exceeds real parcel (~12.41 acres)
    detail: >-
      The 600x600 boundary is a world envelope, not the parcel. Real acreage itself conflicts in sources
      (12.41 real-estate vs 14 promotional, REF-005) — recorded, not merged. Developed program occupies
      a central ~490x580 area; the surplus is landscaped buffer. Not a placement error, flagged for
      clarity so no one reads the boundary as a lot line.
    severity: low

  - id: CONFLICT-05
    topic: Home lot assignment is invented
    detail: >-
      The manifest states which named home sits on which lot was never recovered (builder's choice). The
      west/east row assignments and z-ordering here are creative approximation and carry no historical
      claim. Any other agent's ordering is equally valid.
    severity: low

  - id: CONFLICT-06
    topic: The Ashby Manor story count unknown
    detail: >-
      REF-017 lists The Ashby Manor stories as null. I assumed 2 stories to derive a ground footprint
      (23x23). If it is actually 1 story its footprint would roughly double (~32x32) and would still fit
      its west-row lot with reduced clearance to neighbors (H02 at z-35 and H04 at z-115 leave ~26 blocks
      each side of the z-75 center — a 32-deep box still clears). Flagged so the builder can revise.
    severity: low
