# Deliverable: planning/coordinates.yaml
# Author role: planning engineer. Source of truth: ../references/manifest.yaml (READ FIRST).
#
# ---------------------------------------------------------------------------------------------------
# PROVENANCE / HONESTY NOTE (read before trusting any number here)
# ---------------------------------------------------------------------------------------------------
# The task referenced "the brief" and "section 17 of the brief" and specified exact counts
# (nine zones, fourteen buildings). NO brief file exists in this repository — only
# ../references/manifest.yaml and ../references/README.md. The planning/ directory was empty.
# I therefore AUTHORED this layout directly from the verified manifest rather than transcribing a
# brief. Where the requested structure (9 zones / 14 buildings / section-17 notables) had to be
# invented to be produced at all, I say so and label the confidence. See assumptions_and_gaps and
# conflicts_detected at the bottom. Another agent cross-checking against a real brief should expect
# my zone/building *set* to be my own reasoned construction, not a shared canonical list.
#
# CONFIDENCE VOCABULARY (inherited from the manifest; never upgraded):
#   verified                           - primary/multi-source (used for building SIZES and the roster)
#   high-confidence inference          - one good source / strong read (used for the layout SEQUENCE)
#   moderate-confidence reconstruction - assembled from snippets
#   creative approximation             - no evidence; invented for the build (home lot positions, exact XZ)
#
# WHAT IS VERIFIED vs INVENTED IN THIS FILE:
#   - Building floor areas / story counts .......... verified (Colliers flyer + official home pages)
#   - Footprint block dimensions ................... derived (verified sqft -> blocks via project scale)
#   - Front-to-back functional SEQUENCE ............ high-confidence inference (Colliers annotated aerial)
#   - Absolute XZ coordinates of everything ........ creative approximation (no survey; my placement)
#   - Which named home sits on which lot ........... creative approximation (manifest: order unknown)
#   - South-facing frontage orientation ............ project constant (OVERRIDES the real west-facing site)
# ---------------------------------------------------------------------------------------------------

