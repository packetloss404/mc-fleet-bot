# MainStreet America (Spring, TX) — Building Manifest
# Minecraft Java 1.21.x reconstruction. Planning-engineer deliverable.
# Cross-checked against: references/manifest.yaml (source record) and planning/site-plan.md (zones/centroids).
#
# ---------------------------------------------------------------------------------------------------
# CONFIDENCE DISCIPLINE (never upgraded; mirrors references/manifest.yaml)
#   verified                 - primary/multi-source fact (e.g. home names, styles, sqft, building sizes)
#   high_confidence_inference- arithmetic on verified data (e.g. footprint blocks derived from verified sqft)
#   moderate_reconstruction  - assembled from weak/unlabeled evidence
#   creative_approximation   - no evidence; this build invents it (all facades, palettes, lot ordering, coords)
# When prose polish and a tag disagree, trust the tag. A reconstruction with honest gaps is the goal.
#
# ---------------------------------------------------------------------------------------------------
# ASSUMPTIONS & DEVIATIONS THE READER MUST KNOW (see also: full report to the orchestrator)
#
#   A1. NO LITERAL BRIEF RECOVERED. The task references "the brief" with an MSA-00..MSA-13 table and
#       numbered "section 14" (minimum interior program) and "section 20" (building_record schema).
#       That document is NOT present in this repo. Only the system-prompt baseline, manifest.yaml, and
#       site-plan.md were available. The id->structure mapping, the section-14 room program, and the
#       section-20 field set below are RECONSTRUCTED from those sources + the field list enumerated in
#       the task. If a canonical brief exists, it wins; reconcile against it.
#
#   A2. 15 VERIFIED STRUCTURES vs 14 REQUESTED IDS. The verified program is: Guest & Design Center +
#       Cooking School/Retail (Bldg 2) + Warehouse (Bldg 3) + 12 model homes = 15 buildings. MSA-00..
#       MSA-13 is only 14 ids. I did NOT drop a verified structure. I resolved the off-by-one with the
#       ONE merge that has documentary support: the cooking school. Promotional sources (manifest
#       REF-008) place the culinary school "housed inside" the Guest Center; the Colliers survey
#       (REF-009 / site-plan Z05) isolates it as a separate 8,342 SF Building 2. I model it as an
#       EMBEDDED ANNEX of MSA-00 while preserving its separate site-plan footprint/centroid (−112,−7)
#       inside MSA-00 so a cross-check agent can still find a building there — or split it back out to
#       its own pad. This is a documented conflict, recorded both ways, not silently merged.
#
#   A3. ORIENTATION IS ROTATED (from site-plan.md flag 1). Real parcel fronts I-45 on its WEST; the
#       project constants mandate the entrance on the SOUTH (+Z). The whole west->east functional
#       gradient is rotated 90 deg CW: real-west/front -> build-south/+Z; real-east/rear -> build-north/-Z.
#       Ordering of functions is faithful; the compass bearing is a build convention, not a survey.
#
#   A4. THE STREET IS AN OVAL BY DIRECTIVE (site-plan.md flag 2). The real homes lined ONE straight
#       dead-end cul-de-sac, homes on both sides (VERIFIED, REF-015). The build renders a graceful oval
#       ring. Homes-on-both-sides is honored (8 on the outer ring, 4 on an inner island). The curved
#       geometry is a creative deviation.
#
#   A5. WHICH NAMED HOME SITS ON WHICH LOT IS UNKNOWN (REF-015 / manifest unknowns). No site plan
#       mapped home->lot. The MSA-01..MSA-12 id assignment AND every home coordinate below are
#       creative_approximation. Ordering is the builder's choice; another agent may reshuffle freely.
#
#   A6. EVERY FACADE/PALETTE/ROOF IS CREATIVE (REF-019). No source documents any building's exterior
#       material, color, or roof form. Style NAMES are verified; the block choices that render them are
#       creative_approximation and must be labeled as such to visitors.
#
#   A7. SITE CONDITION — CORRECTED 2026-07-25 (the old "NO-OP / no plugins" text was false).
#       WorldEdit 7.4.0 + WorldGuard 7.0.16 ARE installed; all five bots ARE opped (level 4).
#       Absent: Dynmap/BlueMap, EssentialsX, Citizens. All coordinates remain plain world coordinates
#       buildable by plain block placement. Region protection is now PARTLY active: region
#       `mainstreet_america` carries `mob-spawning: deny` (see ../../raven-rock/qa/oq3-worldguard.md);
#       build/grief flags are NOT set and would be inert while the bots hold op (OQ-2).
# ---------------------------------------------------------------------------------------------------

schema_version: "reconstructed-1.0"   # see A1: section-20 schema reconstructed from the task field list

site_reference:
  world_origin: [0, 64, 0]
  base_build_elevation_y: 64
  envelope: { x_min: -300, x_max: 300, z_min: -300, z_max: 300 }
  compass: { north: "-Z", south: "+Z", east: "+X", west: "-X" }
  principal_entrance_side: "SOUTH (+Z)"   # creative convention (A3)
  scale: "1 horizontal block ~= 2 real feet; 1 block^2 ~= 4 sq ft"
  minecraft_edition: "Java 1.21.x, vanilla-compatible blocks only, no resource pack"
  zone_source: "planning/site-plan.md sections 2-3 (Z01-Z09)"

# Legend for per-record fields (reconstructed section-20 schema):
#   category           - guest_center | model_home | service
#   style              - verified architectural style (homes) or building class (non-homes)
#   verified_spec      - the primary-sourced numbers this record must honor (with manifest REF)
#   location_center    - [x, y, z] footprint centroid (creative_approximation; cross-check target)
#   building_record:
#     status           - historical design-phase value only; do not use as current build state.
#                        Current status/condition lives in data/world-map.db and the 2026-07-26 audit.
#     confidence        - per-aspect tags (program/size vs placement vs appearance)
#     footprint        - {width_x, depth_z, area_blocks} ground-floor plate in blocks
#     floors           - integer story count (verified where sourced)
#     entrance_coordinate - [x,y,z] of the front door, 1 block outside the facing wall
#     palette          - vanilla 1.21 blocks, ALL creative_approximation (A6)
#     rooms            - interior program (reconstructed section-14 minimum + size-scaled additions)
#     completion (5 booleans) - footprint_staked, exterior_shell_complete, roof_complete,
#                               interior_complete, palette_and_detailing_complete  (all false)
#     defects          - open issues / known reconstruction gaps
#     notes            - DISTINCT massing/roofline/entry concept + confidence commentary

