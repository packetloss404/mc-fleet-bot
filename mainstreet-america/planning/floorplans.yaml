# MainStreet America — authored model-home floor plans
#
# These plans fit the measured 2026-07-26 shells. Room placement and circulation
# are creative reconstruction; home names, styles, area, and story counts retain
# the confidence labels in buildings.yaml. Bounds are inclusive Minecraft blocks.

schema_version: 1
world: world
project_id: mainstreet-america
design_elevation: 64
status: built_and_audited

rules:
  - Preserve the accepted roof decisions in docs/DECISIONS-2026-07-25.md.
  - Keep a two-block-clear route from every exterior door to the principal stair.
  - Ground partitions occupy y65..68; upper partitions start one block above each floor slab.
  - Exterior walls and floor slabs are outside every room bound below.
  - Room labels describe architectural intent; Minecraft furniture is representative, not a code claim.

