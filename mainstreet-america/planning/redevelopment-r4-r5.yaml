design_principles:
  - Preserve every completed building shell and interior.
  - Do not move B02, B03, H01-H12, or C02-C07.
  - H01-H12 continue to address Main Street (R01).
  - C02, C04, and C06 address West Lane (R02).
  - C03, C05, and C07 address East Avenue (R03).
  - Use detached seven-by-seven garage pavilions with five-by-five clear interiors.
  - Keep front-door walks distinct from three-wide vehicle access.
  - Give B02 a public culinary forecourt and B03 a clearly screened service identity.

