schema_version: 1
id: mainstreet-america-project-grid
as_built_date: 2026-07-26
coordinate_system: Minecraft Java block coordinates; X east/west, Z south/north

principles:
  - SITE is the protected planning envelope, not a literal fence line.
  - Every physical fence belongs to an inventoried division, block, or project.
  - Public roads and sidewalks remain outside project fences and enter only at declared gates.
  - Neighborhood fences must be land-only; water plinths and anonymous gaps are forbidden.
  - Subsurface Raven Rock geometry never drives surface property boundaries.

