# MainStreet America (Spring, TX) — Minecraft Reconstruction: MATERIAL PALETTE DOCUMENT
# Deliverable: planning/palettes.yaml
# Author role: planning engineer. Source of truth: ../references/manifest.yaml (READ FIRST).
#
# ===================================================================================================
# PROVENANCE / HONESTY NOTE  (read before trusting any block choice here)
# ===================================================================================================
# The task cited "the luxury residential material list in section 11", "section 13" (landscaping) and
# "section 15" (lighting) of a brief. NO brief file exists in this repository — only
# ../references/manifest.yaml and ../references/README.md (confirmed; the same gap the coordinates.yaml
# and site-plan.md authors recorded as CONFLICT-02 / the "no brief / section 17" note). There is no
# "section 11/13/15" to transcribe. I therefore AUTHORED the section-11 master material list, the
# section-13 landscaping palette and the section-15 lighting palette below, reasoned from the verified
# manifest. Another agent cross-checking against a real brief should treat these palettes as my
# reasoned construction, not a shared canonical list.
#
# THE GOVERNING TRUTH — REF-019 and the manifest unknowns:
#   NO retrieved source documents the facade material, color, roof form, or window pattern of the
#   Guest Center OR of any of the 12 homes. Only building SIZES, STORY COUNTS and STYLE NAMES are
#   verified (REF-007, REF-009, REF-010, REF-017). Therefore EVERY block id assigned to a wall, roof,
#   trim, window, door, foundation or accent below is a CREATIVE APPROXIMATION. The architectural
#   STYLE NAME each palette is keyed to is verified (REF-017); the MATERIALS chosen to express that
#   style are invented. A visitor sign must say so. Do not present any facade here as documented fact.
#
# CONFIDENCE VOCABULARY (inherited from the manifest; never upgraded):
#   verified                           - primary/multi-source (here: only the STYLE NAMES / SIZES)
#   high-confidence inference          - one good source / a strong read
#   moderate-confidence reconstruction - assembled from snippets
#   creative approximation             - no evidence; invented for the build (ALL facade materials)
#
# BLOCK-ID DISCIPLINE:
#   Every block id used below was checked to be a real, currently-existing Minecraft Java 1.21 block.
#   No invented ids; no removed/renamed blocks (e.g. "grass" the plant is written "short_grass", its
#   1.20.3+ name). 1.21-era additions used here (verify present on the target 1.21.x server): the tuff
#   family (polished_tuff, tuff_bricks), the copper build set (chiseled_copper, copper_grate,
#   copper_bulb, copper_door, copper_trapdoor, cut_copper_stairs and weathered/exposed/oxidized
#   variants). Blocks from 1.21.4+ (pale oak, resin) are DELIBERATELY AVOIDED for compatibility.
# ===================================================================================================

meta:
  subject: MainStreet America home-design attraction, 18750 Interstate 45 N, Spring, TX 77373 (closed)
  minecraft_version: "1.21.x"
  block_palette_rule: vanilla-compatible only, no resource pack
  site_conditions: >-
    CORRECTED 2026-07-25 — the previous "no plugins / bots NOT opped" text was false. WorldEdit 7.4.0 and
    WorldGuard 7.0.16 ARE installed; the bots ARE opped (level 4). Dynmap/BlueMap and Citizens are absent.
    This remains a material manifest for bot-driven placement and nothing in it *depends* on // commands
    or op. Region protection is partly active: `mainstreet_america` carries `mob-spawning: deny`; build
    flags are not set (see ../../raven-rock/qa/oq3-worldguard.md).
  facade_confidence_blanket: >-
    creative approximation — REF-019. Style names & sizes verified (REF-017); all materials invented.
  building_set_note: >-
    The "fourteen buildings" are keyed to coordinates.yaml's `buildings:` set exactly: Guest Center
    (B01) + Retail/Cooking School (B02) + the 12 showcase homes (H01–H12) = 14. The Warehouse (N01)
    is classified in coordinates.yaml under notable_locations, not buildings (see its CONFLICT-01), so
    it is NOT one of the fourteen; I still provide its palette at the end as a flagged extra so a
    builder is not left without materials for a real, verified structure.

# ===================================================================================================
# GENERAL SITE PALETTE  (the six items given by the project owner, "exactly as given")
# These cover paving, edges and ground cover across ALL zones; individual buildings override locally.
# ===================================================================================================
site_palette:
  asphalt:
    intent: dark roadway paving — the frontage road, entrance drive, service route, loop carriageway
    primary: black_concrete
    alternates: [gray_concrete, cyan_terracotta]   # gray_concrete for sun-faded lanes
    confidence: creative approximation
    note: >-
      Real drives were asphalt (dark). Distinct from the PARKING FIELD, which the sources describe as
      "concrete" (pale) — see sidewalks/curbs below and coordinates.yaml zone 2. Use light_gray_concrete
      or smooth_stone for the ~100,000 SF concrete parking apron, black_concrete for the asphalt roads.
  curbs:
    intent: raised edge between paving and planting / between road and sidewalk
    primary: smooth_stone_slab
    alternates: [stone_slab, light_gray_concrete, smooth_stone]
    confidence: creative approximation
  sidewalks:
    intent: pedestrian walks, forecourt plaza, loop-side promenade, parking-field concrete apron
    primary: smooth_stone
    alternates: [light_gray_concrete, stone, andesite]   # light_gray_concrete = the concrete parking field
    confidence: creative approximation
  lane_markings:
    intent: parking stall lines, drive centerlines, crosswalks
    primary: white_concrete            # stall lines, edge lines, crosswalk bars
    secondary: yellow_concrete         # drive centerlines / no-park hatching
    confidence: creative approximation
    note: full blocks read as paint stripes at 1 block ≈ 2 ft scale; use single-block-wide runs.
  grass:
    intent: lawns, event lawn (Z09), greenbelt turf (Z08), median planting
    primary: grass_block
    cover: [short_grass, tall_grass, fern]              # short_grass = the 1.20.3+ name for the plant "grass"
    confidence: creative approximation
  mulch:
    intent: planting beds, tree rings, foundation borders around every building
    primary: coarse_dirt
    alternates: [rooted_dirt, podzol]                   # rooted_dirt reads as bark-mulch; podzol as pine-straw
    confidence: creative approximation
    note: >-
      Texas Gulf-Coast beds are typically pine-straw or hardwood mulch; coarse_dirt is the closest
      neutral brown. podzol edges evoke pine straw near the pines/cypress in the landscape palette.

# ===================================================================================================
# SECTION 11 — LUXURY RESIDENTIAL MATERIAL MASTER LIST  (authored; see provenance note)
# A curated vanilla-1.21 kit for high-end residential/hospitality architecture. Every building palette
# below draws ONLY from this master list, so the site reads as one coherent material family.
# Grouped by role. All ids verified to exist in 1.21.
# ===================================================================================================
section_11_master_material_list:
  authored: true
  confidence: creative approximation
  stone_and_masonry:
    limestone_cream: [smooth_sandstone, cut_sandstone, chiseled_sandstone, sandstone]
    whitestone_classical: [quartz_block, smooth_quartz, quartz_bricks, quartz_pillar, chiseled_quartz_block, calcite]
    fieldstone_grey: [stone_bricks, mossy_stone_bricks, cracked_stone_bricks, chiseled_stone_bricks, cobblestone, mossy_cobblestone]
    dressed_grey: [smooth_stone, andesite, polished_andesite, polished_diorite]
    dark_stone: [polished_deepslate, deepslate_bricks, deepslate_tiles, polished_blackstone, polished_blackstone_bricks]
    warm_stone: [granite, polished_granite, tuff_bricks, polished_tuff]
    fired_clay_masonry: [bricks, mud_bricks, packed_mud]
    creamstone_accent: [end_stone_bricks]
  render_and_stucco:      # painted stucco / plaster fields via terracotta (matte, not glossy glazed)
    warm_earth: [orange_terracotta, brown_terracotta, yellow_terracotta]
    cool_neutral: [white_terracotta, light_gray_terracotta]
    coastal_soft: [light_blue_terracotta]
    craftsman_earth: [green_terracotta]
  concrete_modern:
    [white_concrete, light_gray_concrete, gray_concrete, black_concrete]
  timber_and_siding:
    natural_wood_trim: [stripped_oak_log, stripped_spruce_log, stripped_dark_oak_log, stripped_birch_log]
    painted_siding: [spruce_planks, oak_planks, birch_planks]     # read as clapboard runs
  metal_and_copper:
    copper_roof_and_clad: [cut_copper, exposed_cut_copper, weathered_cut_copper, oxidized_cut_copper, chiseled_copper, copper_grate, copper_block]
    wrought_iron: [iron_bars, iron_block]
  roofing_stairs:         # pitched roofs are built from stairs; role-tagged by the hue they read as
    clay_tile_deep_red: [brick_stairs, nether_brick_stairs]
    clay_tile_terracotta: [granite_stairs, acacia_stairs]
    slate_grey: [deepslate_tile_stairs, polished_deepslate_stairs, polished_andesite_stairs]
    wood_shingle: [spruce_stairs, dark_oak_stairs]
    metal_standing_seam: [cut_copper_stairs, exposed_cut_copper_stairs, weathered_cut_copper_stairs, oxidized_cut_copper_stairs]
    stone_and_cream: [smooth_sandstone_stairs, quartz_stairs, smooth_quartz_stairs, end_stone_brick_stairs, stone_brick_stairs, mud_brick_stairs]
  flat_roof_and_slab:
    [smooth_stone_slab, smooth_quartz_slab, smooth_sandstone_slab, mud_brick_slab]   # + full concrete for parapets
  glazing:
    clear: [glass, glass_pane]
    framed_tint: [white_stained_glass_pane, light_gray_stained_glass_pane, gray_stained_glass_pane, brown_stained_glass_pane, light_blue_stained_glass_pane, black_stained_glass_pane]
    curtain_wall: [tinted_glass, black_stained_glass, gray_stained_glass_pane]
  shutters_trapdoors:     # window shutters, dormer louvers, vents
    [dark_oak_trapdoor, spruce_trapdoor, birch_trapdoor, oak_trapdoor, copper_trapdoor, iron_trapdoor]
  doors:
    [dark_oak_door, spruce_door, oak_door, birch_door, copper_door, iron_door]
  railings_walls_fences:
    [cobblestone_wall, stone_brick_wall, brick_wall, sandstone_wall, spruce_fence, oak_fence]
  accents_and_detail:
    [chiseled_sandstone, chiseled_stone_bricks, chiseled_quartz_block, chiseled_copper, gilded_blackstone, dripstone_block, flower_pot]

