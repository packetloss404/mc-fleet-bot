assumptions_and_notes:
  - id: A01
    topic: No brief / no sections 11, 13, 15
    detail: >-
      As with coordinates.yaml (CONFLICT-02) and site-plan.md, no brief with numbered sections exists in
      the repo. The section-11 master list, section-13 landscaping and section-15 lighting palettes are
      AUTHORED from the manifest, not transcribed. Treat the palette SET as reasoned, not canonical.
    severity: high
  - id: A02
    topic: Every facade material is creative approximation (REF-019)
    detail: >-
      Style NAMES and SIZES are verified (REF-017); NO source documents any material, color, roof form,
      or window pattern. All wall/roof/trim/window/door/foundation/accent block choices are invented and
      must be labeled as such to visitors. This is the single most important honesty flag in the file.
    severity: high
  - id: A03
    topic: The fourteen buildings = B01 + B02 + H01-H12 (warehouse excluded)
    detail: >-
      I keyed the fourteen palettes to coordinates.yaml's `buildings:` set for cross-check consistency.
      That file classifies the Warehouse under notable_locations (its CONFLICT-01), so it is the 15th
      structure, not one of the fourteen. I still supply warehouse_palette so no verified building lacks
      materials. If a real brief defines a different set of 14, reconcile the membership then.
