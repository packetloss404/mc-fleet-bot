      Copper build-set (copper_door, copper_trapdoor, copper_bulb, chiseled_copper, cut_copper_stairs +
      weathered/exposed/oxidized variants) and the tuff family are 1.21.0 additions used above. dirt_path
      is the 1.17+ renamed "grass_path". short_grass is the 1.20.3+ name of the plant "grass". All are
      valid on stock 1.21.x. Blocks added in 1.21.4+ (pale oak, resin) were intentionally NOT used.
    severity: low
  - id: A05
    topic: Distinctness discipline
    detail: >-
      No two of the fourteen share a dominant wall+roof combination. Roof hues are spread deliberately:
