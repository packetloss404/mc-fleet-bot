    St. Augustine/Bermuda turf. Lush, broadleaf-evergreen dominant, seasonal pink/white bloom.
  ground_and_beds:
    lawn_turf: {blocks: [grass_block, short_grass, tall_grass, fern], intent: St. Augustine / Bermuda lawn}
    planting_bed_mulch: {blocks: [coarse_dirt, rooted_dirt, podzol], intent: hardwood mulch / pine straw}
    bare_and_path_edge: {blocks: [dirt_path, gravel], intent: informal path shoulders}   # dirt_path verified 1.21
    wetland_soil: {blocks: [mud, packed_mud, moss_block, moss_carpet], intent: pond margins / cypress flat}
  canopy_trees:
    southern_live_oak:
      trunk: oak_log
      canopy: oak_leaves
      form: wide low-branching spreading canopy — the signature Gulf-Coast shade tree
      confidence: creative approximation
    southern_magnolia:
      trunk: dark_oak_log
      canopy: dark_oak_leaves
      accent: white_tulip / lily_of_the_valley at base   # stands in for large white blooms
