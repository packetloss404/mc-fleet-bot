#       RR-B1 (-30,-8,-15) 40x34 3fl ; RR-B2 (38,-8,-15) 32x30 3fl ;
#       RR-B3 (0,-6,100) 44x30 3fl   ; RR-B4 (-150,-14,-10) 40x28 2fl.
#   * Non-overlap: RR-B1 x[-50,-10] vs RR-B2 x[22,54] -> 32-block X gap; RR-B3 z[85,115] is 83 south of
#     the Cavern-A pair (z max +2); RR-B4 x[-170,-130] is 80 west of RR-B1. No two footprints intersect.
#   * Containment: each building inside its cavern box (RR-Z1/Z2/Z3) and inside envelope x/z[-300,300].
#   * Y-range: buildings occupy y-18..y11; deepest floor y-18 > ~y-20 target; each building_top_y (9,9,11,-2)
#     stays below its cavern ceiling (40,40,36,28). No cavern/building enters MSA's y62->y79 band
#     (the RR-Z5 shaft alone reaches y64, at x=200 outside MSA x[-70,70] -- see next line).
#   * MSA collision: RR ceiling y40 is 22 blocks below MSA foundation y62; only the RR-Z5 shaft (x=200,
#     outside MSA x[-70,70] and east of every MSA planned surface element) crosses the buffer, through rock alone.
#   * DISCREPANCIES TO RECONCILE (all documented): (a) four buildings vs contested three/five (A1/GAP-02);
