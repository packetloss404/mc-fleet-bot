    building_top_y: 11                           # -6 + 3*5 + 2
    spring_pedestal_height: 4
    program_basis: high-confidence inference      # self-sufficient community (REF-009)
    geometry_confidence: creative approximation
    style_confidence: creative approximation

  - id: RR-B4
