# footprint = ground-floor bounding box in blocks {x_size, z_size}, centered on location_center.
# footprint_x span = center.x +/- x_size/2 ; footprint_z span = center.z +/- z_size/2.
# floors * 5 = wall height in blocks; +2 for roof. building_top_y = base_y + floors*5 + 2.
# EVERY value here is creative approximation; springs/multi-story concept is inference only (REF-005).
