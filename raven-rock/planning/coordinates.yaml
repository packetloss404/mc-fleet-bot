# Raven Rock Mountain Complex (Site R) — Minecraft Reconstruction: COORDINATE MANIFEST
# Deliverable: planning/coordinates.yaml
# Author role: spatial-design engineer.
# MASTER DOCUMENT: planning/site-plan.md  (this file cross-checks against it and must AGREE exactly).
# Source of truth for what is public vs invented: ../references/manifest.yaml (READ FIRST).
#
# ---------------------------------------------------------------------------------------------------
# PROVENANCE / HONESTY NOTE (read before trusting any number here)
# ---------------------------------------------------------------------------------------------------
# Raven Rock's INTERIOR IS CLASSIFIED. There is NO public floor plan, and since 2007 DoD policy forbids
# making "any photograph, sketch, picture, drawing, map or graphical representation" of the complex
# (manifest REF-015). Accordingly, EVERY coordinate, cavern outline, building footprint, tunnel route,
# room, and dimension in this file is CREATIVE APPROXIMATION — invented for the build. What is public is
# only the SETTING and CONCEPT: greenstone geology (REF-003, verified); freestanding multi-story
# buildings on shock-isolation springs in blasted caverns (REF-005, inference); several tunnel portals
# (REF-007, inference); self-sufficient utilities (REF-009, inference); a continuity-of-government /
# ANMCC mission (REF-010, verified). This is an openly-labeled imaginative interpretation of a public
# landmark, NOT a claimed map of the real facility.
#
# CONFIDENCE VOCABULARY (inherited from the manifest; NEVER upgraded):
#   verified                           - primary/multi-source public fact (geology, mission, era)
#   high-confidence inference          - one good source / strong read (springs concept, ~4 portals, utilities)
#   moderate-confidence reconstruction - assembled from weak/qualitative hints
#   creative approximation             - no evidence; invented for the build (ALL coordinates & dimensions here)
#
# WHAT IS VERIFIED vs INVENTED IN THIS FILE:
#   - Greenstone rock / command mission / that caverns were blasted .... verified (context only)
#   - Springs-in-caverns concept / ~four portals / utility self-sufficiency . high-confidence inference (concept only)
#   - EVERY XZ/Y coordinate, cavern box, building footprint, tunnel route . creative approximation
#   - The ~20-block burial depth ...................................... creative convention (not the real ~650 ft)
#   - Four buildings (vs contested three/five) ....................... creative design choice (REF-006)
# ---------------------------------------------------------------------------------------------------

meta:
  subject: Raven Rock Mountain Complex ("Site R"), Blue Ridge Summit, Adams County, PA — the "underground Pentagon"
  minecraft_version: "1.21.x"
  block_palette: vanilla-compatible only, no resource pack
  master_document: planning/site-plan.md   # authoritative for all centroids/dimensions; this file agrees with it
  site_conditions: >-
    CORRECTED 2026-07-25 — the long-standing "stock Paper, NO plugins" premise was FALSE. `plugins` over
    RCON reports three: PacketCraft, **WorldEdit 7.4.0** and **WorldGuard 7.0.16**, both installed and
    responsive. WorldEdit //commands ARE therefore available (driven through an opped bot, since console
    has no selection), and WorldGuard regions ARE enforceable. Still ABSENT: Dynmap/BlueMap, EssentialsX,
    Citizens — so `integration/map-marker.yaml` and `integration/warps.yaml` remain genuinely dormant,
    but `integration/worldguard.yaml` is no longer blocked. CORRECTION: builder bots ARE now
    opped (level 4, per the MSA as-built survey / ops.json) — the earlier "not opped" premise is stale.
    Plain world coordinates remain the primary placement method for bot-driven building.
    "Protected envelope" is now a PARTLY enforced region: WorldGuard region `raven_rock`
    (x[-300,300] y[-64,61] z[-300,300], priority 11) plus `raven_rock_shaft` (x[193,207] y[-12,64]
    z[-22,-8], priority 20) were created 2026-07-25 with `mob-spawning: deny` set — see
    `qa/oq3-worldguard.md`. The build/grief flags are deliberately NOT set yet: the bots are opped and
    op BYPASSES WorldGuard build:deny, so build protection is worthless until the OQ-2 de-op happens.
    PROTECTION MODEL — DECIDED
    (see planning/open-questions.md OQ-2): builder bots stay opped DURING construction, then are DE-OPPED
    once the build completes, after which WorldGuard build:deny protects the museum normally. The de-op is
    a post-build operational step, NOT yet performed. Same decision applies to MSA (shared museum profile).
  integrity_disclosure: >-
    Interior classified (REF-015); every coordinate below is creative approximation and must be labeled
    as such to visitors. This is not a claimed depiction of the real, secret interior.

# ---------------------------------------------------------------------------------------------------
# ORIGIN, SCALE, ORIENTATION, BOUNDARY, and the VERTICAL relationship to MainStreet America (MSA)
# ---------------------------------------------------------------------------------------------------
project:
  origin: {x: 0, y: 64, z: 0}          # shared world origin; y=64 is the MSA surface/build plane
  scale:
    horizontal_blocks_per_foot: 0.5     # 1 block ~= 2 real feet
    vertical_blocks_per_story: 5        # ~10 ft/story -> 5 blocks wall height (roof extra)
    note: >-
      creative convention shared with MSA. The real complex is popularly said to sit ~650 ft below the
      summit (REF-008); reproduced literally that is ~325 blocks down and off-envelope. Per the manifest
      build-scale note we bury the complex only ~20 blocks beneath the MSA plane as a deliberate stand-in.
  orientation:
    north: "-Z"
    south: "+Z"
    east: "+X"
    west: "-X"
  boundary:
    min: {x: -300, z: -300}
    max: {x: 300, z: 300}
    size_blocks: {x: 600, z: 600}
    note: The complex occupies the SUB-SURFACE volume of the same 600x600 envelope MSA sits on top of.
  vertical_stacking:                    # THE key cross-build constraint (see site-plan.md section 1.1)
    msa_surface_band:   {y_min: 62, y_max: 79, footprint: {x_min: -70, x_max: 70, z_min: -235, z_max: 200}}
    rock_buffer_band:   {y_min: 41, y_max: 61, content: "solid greenstone; no excavation except the RR-Z5 shaft"}
    ravenrock_ceilings: {y: 40, note: "cavern roofs begin here; utility cavern ceiling lower at y28"}
    ravenrock_floors:   {main: -12, deepest: -18, note: "deepest = Cavern C reservoir sump; stays above bedrock"}
    buffer_thickness_blocks: 22          # y40 ceiling to y62 MSA foundation
    collision_statement: >-
      Raven Rock's highest CAVERN/complex point (y40) is 22 blocks below MSA's y62 foundation (the
      22-block greenstone buffer). No cavern or building geometry enters MSA's y62->y79 band; the RR-Z5
      shaft ALONE rises to y64 into that band, but at x in [193,207], z in [-22,-8] -- OUTSIDE MSA's x in
      [-70,+70] footprint AND east of every MSA surface element (nearest is the Z09 event lawn at x<=160,
      ~33 blocks west) -- so its Y-overlap collides with no MSA block, only rock/greenbelt. A labeled deliberate liberty.
    confidence: creative approximation

# ---------------------------------------------------------------------------------------------------
# FIVE ZONES  — plan box bounds are [min_x, min_z, max_x, max_z]; floor_y / ceiling_y give the vertical.
# All boxes, floors, and ceilings are creative approximation (interior classified, REF-015/016).
# ---------------------------------------------------------------------------------------------------
zones:
  - id: RR-Z1
    name: Central Operations Cavern (Cavern A)
    bounds: [-75, -45, 75, 15]
    floor_y: -12
    ceiling_y: 40
    purpose: >-
      Main blasted chamber (~52 blocks tall). Holds the Command & Operations Center (RR-B1) and the
      Signal & Communications Center (RR-B2) on visible spring isolation; central junction rotunda (N10)
      where the four portal tunnels and inter-cavern corridors meet. Mission basis REF-010 (verified);
      springs concept REF-005 (inference); ALL geometry creative approximation.
    confidence: creative approximation

  - id: RR-Z2
    name: Habitation & Support Cavern (Cavern B)
    bounds: [-45, 70, 45, 130]
    floor_y: -10
    ceiling_y: 36
    purpose: >-
      Self-sufficient habitation zone (Quarters, Dining & Medical = RR-B3), enabling months of sealed
      operation (REF-009, inference). Its south wall receives the South Personnel Tunnel (T2), which since
      the OQ-8 relocation enters at the wall's WEST end (x=-45) rather than on the x=0 axis. Geometry creative.
    confidence: creative approximation

  - id: RR-Z3
    name: Utility & Reservoir Cavern (Cavern C)
    bounds: [-185, -35, -115, 15]
    floor_y: -18            # reservoir sump = deepest point in the complex
    ceiling_y: 28
    purpose: >-
      Utility cavern: Power & Ventilation Plant (RR-B4) plus two underground reservoirs. Self-sufficiency
      systems are a stable public theme (REF-009, inference); the "two reservoirs / dual power" counts are
      popular figures, not authoritative (conflict). Sizes/positions creative approximation.
    confidence: creative approximation

  - id: RR-Z4
    name: Portal & Blast-Vestibule Network
    bounds: [-300, -300, 300, 300]    # distributed: the four gently-curving portal tunnels + vestibules
    floor_y: -18
    ceiling_y: 25
    purpose: >-
      The four curving portal tunnels (T1 north, T2 south, T3 east, T4 west) and their blast-door
      vestibules, threading the greenstone from caverns out to the envelope edges. Tunnels curve gently to
      blunt blast (REF-005/017, inference); FOUR portals matches the common public statement (REF-007,
      inference); exact routes/positions creative approximation. See notable_locations N1-N6 and tunnels[].
    confidence: creative approximation

  - id: RR-Z5
    name: Vertical Access Shaft (deliberate creative liberty)
    bounds: [193, -22, 207, -8]        # RESERVED envelope, 15x15. AS-BUILT BORE IS 9x9 - see below.
    as_built_bore: [196, -19, 204, -11]  # verified 2026-07-25 by census; the reserved envelope was never fully cut
    floor_y: -12                        # base connects Cavern A spur
    ceiling_y: 64                       # rises to the MSA surface plane
    # AS-BUILT CORRECTIONS, 2026-07-25 (docs/DECISIONS-2026-07-25.md, Tier 3):
    #   * Bore is 9x9 at x[196,204] z[-19,-11], not the 15x15 the envelope implies.
    #   * Landings DO exist and always did: solid 9x9 iron_bars platforms at 15 levels,
    #     y-11,-6,-1,4,9,14,19,24,29,34,39,44,49,54,59 - i.e. every y = 4 (mod 5).
    #     The 2026-07-25 audit reported "0/11 iron bars found" because it probed
    #     y28/33/38/-7/-2, every one of which is off by one from the real spacing.
    #   * What was genuinely missing was ACCESS: zero ladders, and the landings were
    #     solid floors with no hatch, so the shaft was not traversable either way.
    #     Now fitted with a 3x3 centre drop through all 15 landings and a continuous
    #     ladder on the EAST wall (x=204, backed by solid stone at x=205). The west
    #     wall cannot carry it - it has a 6-block gap at y-11..-6 which is the S1 spur
    #     mouth, and filling that for ladder backing would brick up the Cavern A route.
    purpose: >-
      A single invented shaft from Cavern A up through the rock buffer to a surface head-house (N9) at
      (200, 64, -15) in MSA's EAST greenbelt, well clear of every MSA planned surface element (x=200 is
      far east of MSA's built footprint x-max 70 and ~33 blocks east of the nearest planned element, the
      Z09 event lawn at x<=160). RELOCATED from the former (120,60) head, which sat inside MSA's planned
      east parking/event-lawn flank (see open-questions OQ-1). A labeled deliberate liberty; locally
      interrupts the rock buffer but collides with nothing.
    confidence: creative approximation

# ---------------------------------------------------------------------------------------------------
