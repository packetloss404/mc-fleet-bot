    footprint: {x_size: 40, z_size: 34}
    floors: 3
    building_top_y: 9                            # -8 + 3*5 + 2
    spring_pedestal_height: 4                    # visible isolation springs, floor y-12 -> base y-8
    program_basis: verified                      # alternate-command mission (REF-010)
    geometry_confidence: creative approximation
    style_confidence: creative approximation

  - id: RR-B2
    name: Signal & Communications Center
    zone: RR-Z1
    location_center: {x: 38, y: -8, z: -15}
    footprint: {x_size: 32, z_size: 30}
    floors: 3
    building_top_y: 9
    spring_pedestal_height: 4
    program_basis: verified                      # 114th Signal Bn / DISA comms tenancy (REF-011)
    geometry_confidence: creative approximation
    style_confidence: creative approximation

  - id: RR-B3
    name: Quarters, Dining & Medical
    zone: RR-Z2
    location_center: {x: 0, y: -6, z: 100}       # base y-6 = 4-block springs above Cavern B floor y-10
    footprint: {x_size: 44, z_size: 30}
