# ---------------------------------------------------------------------------------------------------
# NOTABLE LOCATIONS  (portals, vestibules, rotunda, reservoirs, springs, shaft head)
# ---------------------------------------------------------------------------------------------------
notable_locations:
  - id: N1
    name: North Blast Vestibule
    coordinate: {x: 0, y: -6, z: -120}
    footprint: {x_size: 14, z_size: 14}
    zone: RR-Z4
    confidence: creative approximation
    note: Twin blast doors on the North Vehicle Tunnel. Blast doors exist in concept for a hardened site; placement creative.
    blast_doors: NOT BUILT            # confirmed 2026-07-25, see below
    flood_status: SEALED 2026-07-25   # was flooded: 888 water blocks inside the bore
    as_built_note: >-
      FLOOD FIXED 2026-07-25 (docs/DECISIONS-2026-07-25.md). N1 sits inside a large flooded
      natural cave system. Sealed with a per-slice rock jacket derived from the stone_bricks
      tread (2,128 + 1,773 blocks), plus a perched aquifer pool at y19-21 that sat directly on
      the seal's ceiling and drained down through it (298), plus 41 WATERLOGGED
      pointed_dripstone/glow_lichen. The waterlogged blocks were decisive: the flood
      regenerated to the IDENTICAL extent (523 blocks) after every drain until they were
      removed, which is the signature of a hidden source that `execute if block ... water`
      cannot match and `fill ... air replace water` cannot remove. Verified: 0 blocks refilled
      after 150s across all 136 slices.
      BLAST DOORS: genuinely absent, now confirmed rather than merely "not found at probed
      points" - a full census of the vestibule returns ZERO iron_block; the only iron present
      is natural ore (11 deepslate_iron_ore + 1 iron_ore). R4 stands in full.
  - id: N2
    name: East Blast Vestibule
    coordinate: {x: 180, y: 0, z: -30}
    footprint: {x_size: 12, z_size: 12}
    zone: RR-Z4
    confidence: creative approximation
    blast_doors: NOT BUILT            # confirmed 2026-07-25: zero iron_block; only 5 natural iron_ore
    flood_status: dry                 # no water found in the 2026-07-25 census
  - id: N3
    name: South Personnel Portal (mouth)
    coordinate: {x: -150, y: 18, z: 285}
    zone: RR-Z4
    confidence: high-confidence inference   # "several portals" is attested (REF-007); this position is creative
    note: >-
      RELOCATED 2026-07-24 (OQ-8) from (0, 18, 285). The original position sat on MSA's grand axial
      entrance -- 3 blocks off the frontage-road centerline (z~288) and dead on the x=0 approach
      spine, so its reserved no-build corridor swallowed the entrance drive throat, the frontage
      crossing and the billboard approach. Same trade as OQ-1: the portal network is creative
      approximation, MSA's axial arrival is anchored design, so the invented element moved.
      x=-150 co-locates the portal with MSA's existing SW service gate (Z01, x~-150, z=+300), which
      is already back-of-house, screened by Z08 greenbelt planting, and by design never crosses the
      entrance drive or the oval at grade -- so the bunker's south portal now hides behind a service
      entrance instead of the front door. z is unchanged, so all envelope-extent statements still hold.
  - id: N4
    name: North Vehicle Portal (mouth)
    coordinate: {x: 0, y: 18, z: -285}
    zone: RR-Z4
    confidence: high-confidence inference
  - id: N5
    name: East Portal (mouth)
    coordinate: {x: 285, y: 18, z: -30}
    zone: RR-Z4
    confidence: high-confidence inference
  - id: N6
    name: West Utility Portal (mouth)
    coordinate: {x: -290, y: 10, z: 5}
    zone: RR-Z4
    confidence: high-confidence inference
    flood_status: >-
      MOUTH PERMANENTLY UNDER WATER; complex sealed from it 2026-07-25.
    as_built_note: >-
      The 2026-07-25 audit could only mark N5/N6 INCONCLUSIVE because their chunks had never
      been loaded. Resolved by reading the region files instead - trap #7 applies to RCON
      PROBES, not to region reads, so a generated chunk is on disk whether or not it is loaded.
      N5 east is CLEAN (390 stone_bricks of structure, no water). N6 is FLOODED: the mouth
      opens into a large natural aquifer, 7,165+ water blocks continuing past every box
      measured, with 213 inside the throat itself.
      DRAINING IS IMPOSSIBLE and was never attempted - it is the plaza-lake mistake at scale.
      Instead a 2-block BULKHEAD (211 blocks of deepslate) was built at x=-278/-277, where T4
      is a clean regular bore, sealing the complex from the flooded mouth cavity. T4 east of it
      is verified DRY end to end, including the Cavern C junction at (-185,-16,-10) that the
      audit flagged.
      CONSEQUENCE, stated plainly: N6 is NOT usable as a portal. Making it usable needs a
      coffer through the aquifer, as N3 got. That is a separate build and is NOT done.
      Note also that T4's bore was dry all along; the "1,308 water blocks in T4" reported
      earlier came from a survey box far wider than the tunnel, which both descends
      (y5 -> y-18) and curves (z+7 -> z-13). Locate this tunnel by its stone_bricks tread,
      never by its water.
  - id: N7
    name: Reservoir (single undivided basin)     # AMENDED 2026-07-25: was "Reservoirs 1 & 2 (sumps)"
    coordinate: {x: -150, y: -18, z: -30}
    footprint: {x_size: 40, z_size: 8}      # ONE basin in the south strip of Cavern C, clear of RR-B4
    zone: RR-Z3
    confidence: creative approximation
    note: >-
      "Two reservoirs" is a popular figure, not authoritative (REF-009 conflict); size/position invented.
      Sits at z[-34,-26], south of RR-B4 (z-24..4) with a ~2-block gap; inside Cavern C z[-35,15].
      AMENDED 2026-07-25 per OQ-C/OQ-B (docs/DECISIONS-2026-07-25.md): a 15-point sweep found a
      SINGLE UNDIVIDED BASIN with no partition at x=-150. Since the two-reservoir figure was never
      authoritative and N7 is the best-executed element in the complex (full liner, 0/9 leakage),
      the docs were amended rather than a partition cut into a verified-watertight liner - which is
      exactly the operation that caused the Cavern A aquifer bleed.
    as_built:
      floor_y: -19                          # one course lower than the specified y-18
      liner: prismarine_bricks              # dressed to Z-RESERVOIR 2026-07-25; was clay
      water: 1845                           # verified unchanged across the re-lining
      note: >-
        Relined 1,097 clay -> prismarine_bricks solid-for-solid, so there was never an
        intermediate gap and watertightness was preserved throughout. NOTE for future surveys:
        N7's 369 water columns sit INSIDE Cavern C's floor layer, so a census of that floor
        reports "water in the cavern floor". That is the reservoir, not leak residue - do not
        drain it.
  - id: N8
    name: Central Spring-Isolation Array (under RR-B1)
    coordinate: {x: -30, y: -12, z: -15}
    zone: RR-Z1
    confidence: high-confidence inference   # springs concept REF-005; exact array creative
    note: Visible iron/copper spring stacks + chains lifting RR-B1 off the cavern floor (concept made legible).
  - id: N9
    name: Vertical Access Shaft — Surface Head-House (deliberate liberty)
    coordinate: {x: 200, y: 64, z: -15}
    zone: RR-Z5
    status: BUILT 2026-07-25          # was 0% / MISSING at the 2026-07-25 audit
    as_built:
      footprint: [193, -22, 207, -8]  # 15x15 - the full reserved RR-Z5 envelope, giving a 3-wide apron
      floor_y: 64                     # apron stone_bricks, laid with `replace stone` so it cannot fill the bore
      walls: [65, 69]                 # y65 polished_blackstone base course, y66-69 stone_bricks
      roof_y: 70
      fittings: iron_door (west, x=193 z=-15) · iron_bars railing round the 9x9 mouth · 4 hanging lanterns
      note: >-
        OQ-A chose "build at natural grade, no earthworks". Measured grade at the mouth is
        y63-64, NOT the ~y62 the audit reported, so natural grade here IS the MSA y64 plane -
        the no-earthworks choice and a consistent skyline turned out to be the same decision,
        and the "2-block step down from MSA" the question worried about does not exist.
        Foundation verified solid 144/144 at y62 and y63; the shaft is now enclosed and
        weatherproofed rather than an open hole to the sky.
    confidence: creative approximation
    note: >-
      Emerges at the MSA surface plane in the EAST greenbelt at x=200 (relocated from the former
      (120,64,60) per OQ-1). Clears every MSA planned surface element: ~33 blocks east of the nearest
      (the Z09 event lawn, x<=160), far east of the core buildings (x<=70), and separated in z from the
      parking field (z>=125) and the rear detention/landscape (z<=-215). Within the +-300 envelope.
  - id: N10
    name: Central Junction Rotunda
    coordinate: {x: 0, y: -12, z: 0}
    zone: RR-Z1
    confidence: creative approximation
    note: Hub where T1/T3 and corridors C1/C2 meet inside Cavern A — the heart of the complex.

# ---------------------------------------------------------------------------------------------------
# INTERNAL CONSISTENCY CHECK  (computed, not eyeballed)
# Rules: every building footprint lies inside its zone box AND inside the 600x600 envelope; no two
# building footprints overlap; every Y stays within the buildable range and clear of MSA's y62->y79.
# Method: axis-aligned bounding-box test on center +/- size/2.
# ---------------------------------------------------------------------------------------------------
consistency_check:
  method: axis-aligned bounding box; boxes = center.x +/- x_size/2, center.z +/- z_size/2
  building_extents:
    RR-B1: {x: [-50, -10], z: [-32, 2],   y: [-8, 9]}
    RR-B2: {x: [22, 54],   z: [-30, 0],   y: [-8, 9]}
    RR-B3: {x: [-18, 18],  z: [85, 115],  y: [-6, 11]}   # AMENDED 2026-07-25 to as-built; was x[-22,22]
    RR-B4: {x: [-170, -130], z: [-24, 4], y: [-14, -2]}
  containment_in_zone: PASS       # RR-B1/B2 in RR-Z1 [-75,-45,75,15]; RR-B3 in RR-Z2 [-45,70,45,130]; RR-B4 in RR-Z3 [-185,-35,-115,15]
  containment_in_envelope: PASS   # all building & portal extents within x/z [-300, 300]
  pairwise_building_overlap: PASS # see clearances below
  y_range_check: PASS             # all buildings within y[-18..11]; deepest floor y-18 > ~y-20 target; highest roof y11 < y40 ceilings
  msa_collision_check: PASS       # highest CAVERN/complex point y40 is 22 blocks below MSA y62 foundation; RR-Z5 shaft alone reaches y64 but at x[193,207], outside MSA x[-70,70], so no block collision
  shaft_vs_msa_check: PASS        # RR-Z5 shaft at x=200 clears MSA footprint x[-70,70] AND all planned surface elements (nearest Z09 event-lawn edge x=160 -> 33-block gap); crosses rock/greenbelt only
  tightest_clearances:
    - between: [RR-B1 east edge (x=-10), RR-B2 west edge (x=+22)]
      gap_blocks: 32
      axis: x
    - between: [RR-B1/B2 south edges (z=0..2), RR-B3 north edge (z=+85)]
      gap_blocks: 83
      axis: z
    - between: [RR-B4 east edge (x=-130), RR-B1 west edge (x=-50)]
      gap_blocks: 80
      axis: x
    - between: [RR-B1 roof top (y=9), Cavern A ceiling (y=40)]
      gap_blocks: 31
      axis: y
    - between: [RR ceiling (y=40), MSA foundation (y=62)]
      gap_blocks: 22
      axis: y
  extents_summary:
    x:
      min: -290    # west portal N6 mouth -- the TRUE western extreme, NOT RR-B4's x=-170 west edge (a building edge, not the site extreme)
      max: 285     # east portal N5 mouth
      note: "tightest envelope margin is 10 blocks WEST (N6 x=-290 to boundary x=-300)"
    z: {min: -285, max: 285}   # north portal N4 (min) / south portal N3 (max)
    y: {min: -18, max: 40, note: "min = reservoir sump / cavern C floor; max = cavern ceilings; buildings within -18..11"}
  notes: >-
    Building footprints are structure boxes only; the spring pedestals sit under them and the cavern
    walls stand well clear (each building floats inside a box larger on every side). All four buildings
    are mutually non-overlapping, inside their caverns, inside the envelope, and inside the y-range, and
    NONE enters MSA's y62->y79 band.

# ---------------------------------------------------------------------------------------------------
# ASSUMPTIONS & GAPS  (recorded, not silently resolved)
# ---------------------------------------------------------------------------------------------------
assumptions_and_gaps:
  - id: GAP-01
    topic: The entire interior is invented
    detail: >-
      The interior is classified and legally undocumentable (REF-015/016). Every coordinate, cavern,
      building, tunnel, and room here is creative approximation and carries no historical claim. This is
      the mirror of MSA, where sizes were verified and only surfaces were invented; here almost everything
      spatial is invented.
    severity: high
  - id: GAP-02
    topic: Building count is a design choice (three vs five contested)
    detail: >-
      Wikipedia says three buildings (1953); popular sources say five three-story buildings (REF-006). This
      build uses FOUR as a reasoned middle choice. If a decision standardizes on three or five, reconcile
      site-plan.md, this file, and buildings.yaml together.
    severity: medium
  - id: GAP-03
    topic: Burial depth is a convention, not the real ~650 ft
    detail: >-
      Real depth ~650 ft below summit (REF-008) would be ~325 blocks down and off-envelope. Per the
      manifest build-scale note we bury the complex ~20 blocks (ceiling y40) as a deliberate stand-in.
    severity: low
  - id: GAP-04
    topic: Utility/portal/spring COUNTS are popular figures, not authoritative
    detail: >-
      Two reservoirs, dual power, four portals, and spring counts come from secondary/enthusiast sources
      (REF-007/009 conflicts). Existence is inference; the specific numbers rendered are creative choices.
    severity: low
  - id: GAP-05
    topic: Vertical access shaft is a deliberate liberty
    detail: >-
      RR-Z5 (shaft) and N9 (surface head) are an invented convenience link between the two builds. They
      pierce the rock buffer at x=200 (relocated from x=120 per OQ-1), outside MSA's footprint and east of
      every MSA planned surface element, colliding with nothing. If cut for purity, they drop with no
      effect on the four buildings or four portals.
    severity: low

# ---------------------------------------------------------------------------------------------------
# CONFLICTS DETECTED  (relative to sources / to MSA)
# ---------------------------------------------------------------------------------------------------
conflicts_detected:
  - id: CONFLICT-01
    topic: Greenstone vs "greenstone granite"
    detail: >-
      Popular RRMC write-ups say the complex was blasted from "greenstone granite." Geologically the
      mountain is Catoctin greenstone = a chlorite-rich METABASALT, NOT a granite (REF-003). The rock
      body/palette must read as dark greenish hard metabasalt, not pink/gray granite.
    severity: low
  - id: CONFLICT-02
    topic: Number of internal buildings
    detail: "Three (Wikipedia) vs five (popular). Build uses four (design choice, GAP-02). Recorded, not merged."
    severity: medium
  - id: CONFLICT-03
    topic: Self-sufficiency counts
    detail: "Two reservoirs / dual power plants are popular figures; existence agreed, counts vary (REF-009). Any count here is invented."
    severity: low
