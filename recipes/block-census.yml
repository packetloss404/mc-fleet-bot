version: 1
id: block-census
name: Block Census
description: Counts block states in copied Anvil files, optionally inside bounds.
parameters:
  bounds:
    description: Optional inclusive x1,y1,z1,x2,y2,z2 box.
    required: false
steps:
  - id: snapshot
    type: snapshot-summary
  - id: census
    type: block-census
  - id: report
    type: html-report
    options:
      title: Block Census
