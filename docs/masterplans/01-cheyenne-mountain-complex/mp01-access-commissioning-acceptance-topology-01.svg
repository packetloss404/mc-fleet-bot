<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MP01 commissioning access acceptance authority topology</title>
  <desc id="desc">Named origin, transit, destination, and recovery acceptance feed the route survey and protected MP01 staging boundary; the result remains a non-mutating design input.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#e9eef7}.title{font-size:27px;font-weight:700}.label{font-size:17px;font-weight:700}.note{font-size:13px;fill:#bdc9dc}.box{stroke-width:2}.line{stroke:#9cb2d0;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9cb2d0"/></marker></defs>
  <rect width="1200" height="500" fill="#111827"/><text x="45" y="52" class="title">MP01 access commissioning acceptance — fail-closed gate</text>
  <g><rect x="50" y="105" width="205" height="90" rx="10" fill="#18334d" stroke="#54b9e8" class="box"/><text x="72" y="142" class="label">Origin owner</text><text x="72" y="168" class="note">exact reachable anchor</text></g>
  <g><rect x="50" y="285" width="205" height="90" rx="10" fill="#18334d" stroke="#54b9e8" class="box"/><text x="72" y="322" class="label">Recovery owner</text><text x="72" y="348" class="note">distinct exact anchor</text></g>
  <g><rect x="335" y="105" width="205" height="90" rx="10" fill="#18334d" stroke="#54b9e8" class="box"/><text x="357" y="142" class="label">Transit owner</text><text x="357" y="168" class="note">every crossing/station</text></g>
  <g><rect x="335" y="285" width="205" height="90" rx="10" fill="#18334d" stroke="#54b9e8" class="box"/><text x="357" y="322" class="label">Destination owner</text><text x="357" y="348" class="note">MP01 staging endpoint</text></g>
  <path d="M255 150H605" class="line"/><path d="M255 330H605" class="line"/><path d="M540 150H605" class="line"/><path d="M540 330H605" class="line"/>
  <g><rect x="610" y="145" width="260" height="180" rx="12" fill="#2a2441" stroke="#b89cff" class="box"/><text x="635" y="183" class="label">Source-bound survey</text><text x="635" y="211" class="note">outbound + return station hashes</text><text x="635" y="236" class="note">footing/headroom/owner/interface</text><text x="635" y="261" class="note">independent immutable revalidation</text><text x="635" y="290" class="note">no movement authority</text></g>
  <path d="M870 235H930" class="line"/>
  <g><rect x="935" y="105" width="220" height="260" rx="12" fill="#253526" stroke="#79d48b" class="box"/><text x="958" y="143" class="label">Passive MP01 interface</text><text x="958" y="175" class="note">3 staging foot cells</text><text x="958" y="199" class="note">supports + clearance</text><text x="958" y="223" class="note">7 cells: OFF/no actuation</text><text x="958" y="247" class="note">4 closed manual doors</text><text x="958" y="271" class="note">6 dry vestibule cells</text><text x="958" y="295" class="note">96-cell reservoir wall</text><text x="958" y="332" class="note">no boundary crossing</text></g>
  <text x="50" y="450" class="note">Accepted output: commissioning-readiness design input only. Separate offline mobility review + fresh live gate are still required.</text>
</svg>
