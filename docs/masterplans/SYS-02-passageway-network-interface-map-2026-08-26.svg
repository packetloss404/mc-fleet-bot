<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">SYS-02 PassageWay current network interface map</title>
  <desc id="desc">Topological decision map of the C1 cavern corridor, MP03/B07 hydraulic and gravity boundary, B09 station and guideway boundary, plus the first design contract. Dashed links are not routes.</desc>
  <style>
    .bg{fill:#101722}.panel{fill:#172334;stroke:#71829a;stroke-width:2}.title{fill:#f4f7fb;font:700 25px system-ui,sans-serif}.sub{fill:#bdc9d8;font:15px system-ui,sans-serif}.label{fill:#f4f7fb;font:700 17px system-ui,sans-serif}.body{fill:#d2dbe7;font:14px system-ui,sans-serif}.small{fill:#aebdd0;font:12px system-ui,sans-serif}.ok{fill:#2ea66b}.hold{fill:#e2a640}.stop{fill:#d85b61}.link{fill:none;stroke:#71829a;stroke-width:3;stroke-dasharray:8 7}
  </style>
  <rect class="bg" width="1200" height="820"/>
  <text class="title" x="44" y="46">SYS-02 PassageWay — component, containment, and first-build decision map</text>
  <text class="sub" x="44" y="72">Current MP06 post snapshot • topological only, not geographically to scale • dashed lines are required future contracts, never routes</text>

  <rect class="panel" x="44" y="118" width="330" height="250" rx="12"/>
  <circle class="hold" cx="72" cy="148" r="10"/><text class="label" x="92" y="154">MP08 C1: finite dry strip</text>
  <rect class="hold" x="116" y="206" width="190" height="36" rx="4"/><line x1="116" y1="194" x2="116" y2="253" stroke="#d85b61" stroke-width="7"/><line x1="306" y1="194" x2="306" y2="253" stroke="#d85b61" stroke-width="7"/>
  <line x1="132" y1="188" x2="132" y2="125" stroke="#e2a640" stroke-width="5" stroke-dasharray="6 5"/><line x1="288" y1="188" x2="288" y2="125" stroke="#e2a640" stroke-width="5" stroke-dasharray="6 5"/>
  <text class="body" x="68" y="286">x=-1..1 • z=15..70 • 56/56 dry</text><text class="body" x="68" y="308">3 ambiguous floors • 56 open roofs</text><text class="small" x="68" y="334">two 6-cell cavern crossings; no 3-D contract</text><text class="small" x="68" y="352">C1 must be roofed + vestibulated before release.</text>

  <rect class="panel" x="431" y="118" width="330" height="250" rx="12"/>
  <circle class="stop" cx="459" cy="148" r="10"/><text class="label" x="479" y="154">MP03 / MP05 B07 boundary</text>
  <rect class="stop" x="504" y="200" width="28" height="98" rx="4"/><path d="M562 201 c20 14 -20 28 0 42 s-20 28 0 43" fill="none" stroke="#e2a640" stroke-width="6"/>
  <text class="body" x="455" y="326">MP03: 29 headroom failures</text><text class="body" x="455" y="347">1,034 fluids • 4-cell gravel chain</text><text class="small" x="455" y="366">B07: unbounded fluid/gravity + no owner/landing</text>

  <rect class="panel" x="818" y="118" width="338" height="250" rx="12"/>
  <circle class="stop" cx="846" cy="148" r="10"/><text class="label" x="866" y="154">MP05 B09: closed station seam</text>
  <rect class="stop" x="854" y="203" width="42" height="72" rx="4"/><rect class="ok" x="906" y="225" width="73" height="27" rx="3"/><line x1="993" y1="212" x2="1082" y2="212" stroke="#e2a640" stroke-width="8"/><circle class="hold" cx="1022" cy="212" r="8"/>
  <text class="body" x="842" y="306">12-cell cap • only 6×2×1 void</text><text class="body" x="842" y="328">R12R maintenance rails + tagged cart</text><text class="small" x="842" y="350">C02/C03: rescue discharge = 0/2</text>

  <path class="link" d="M374 245 C393 245 405 245 431 245"/><path class="link" d="M761 245 C780 245 796 245 818 245"/>
  <text class="small" x="384" y="229">no accepted connection</text><text class="small" x="770" y="229">no accepted connection</text>

  <rect class="panel" x="104" y="458" width="952" height="275" rx="12"/>
  <circle class="hold" cx="132" cy="490" r="10"/><text class="label" x="152" y="496">First design contract: SYS02-C1-CONTAINED-CORRIDOR-DESIGN-01</text>
  <text class="body" x="136" y="538">1. Exact unique 3-wide × 3-high C1 profile, including z=48/49/51 multi-floor resolution and one owner per roof/wall/floor/light/drain cell.</text>
  <text class="body" x="136" y="574">2. Reciprocal Cavern-A/C1 and C1/Cavern-B vestibule contracts: access class, failure state, return, drainage, protected exclusions.</text>
  <text class="body" x="136" y="610">3. Projected dry, roofed, lit, bidirectional normal-walk corridor with no uncontrolled cavern-air continuation inside the claimed route volume.</text>
  <text class="body" x="136" y="646">4. Then—and only then—exact forward/inverse, fresh source/entity/preflight/journal/post/rollback kernel and independent corridor QA.</text>
  <text class="small" x="136" y="692">MP03/B07 and B09 remain separately held design systems; this contract does not connect them or create an underground network release.</text>
  <text class="small" x="136" y="716">Outcome today: 0 operations • 0 inverse operations • no normal-walk/egress candidate.</text>
</svg>
