# Raven Rock Mountain Complex (Site R) — Reference Manifest
# Subject: the U.S. government underground continuity-of-government / alternate military
#   command bunker ("the underground Pentagon") near Blue Ridge Summit, Liberty Township,
#   Adams County, Pennsylvania; historically tied to Fort Ritchie (MD) and Camp David.
# Purpose: authoritative, honestly-labeled source record for a Minecraft reconstruction that
#   will sit ~20 blocks BENEATH the "MainStreet America" surface build on the same server.
# Confidence vocabulary (identical to MainStreet America; never upgraded across this file):
#   verified                          - multiple independent sources, or a primary source
#   high-confidence inference         - one good source or a strong read, not independently confirmed
#   moderate-confidence reconstruction- assembled from snippets / unlabeled imagery
#   creative approximation            - no evidence; the build must invent it
#
# INTEGRITY PREAMBLE (read before using any REF below):
#   Raven Rock's INTERIOR IS CLASSIFIED. The internal room layout, tunnel geometry, current
#   systems, contents, personnel, and defenses are NOT publicly documented. Accordingly, the
#   VAST MAJORITY of any spatial/interior detail in the build is a `creative approximation`.
#   What is genuinely public is confined to: the facility's existence and general location; the
#   mountain geology; the CORE DESIGN CONCEPT (freestanding multi-story buildings on giant
#   springs inside blasted caverns); the presence of several tunnel portals; the construction
#   era; the surface support base; and the continuity-of-government / alternate-command role.
#   This manifest deliberately refuses to invent floor plans, corridor dimensions, or room lists
#   and present them as fact. See REF-015: since 2007 DoD policy forbids making "any photograph,
#   sketch, picture, drawing, map or graphical representation" of RRMC — this build is therefore
#   an openly-labeled CREATIVE APPROXIMATION of a public landmark's PUBLIC-RECORD history, and
#   explicitly NOT a claimed map of the real interior.

research_summary:
  retrieval_note: >-
    WebSearch and WebFetch WERE available and returned results. Sources actually retrieved and
    read for this manifest: the English Wikipedia article on Raven Rock Mountain Complex
    (fetched in full); PublicIntelligence.net's Site R page (fetched); Grey Dynamics' "US Secret
    Bases: Raven Rock Mountain" (fetched); and geology sources for the Catoctin Formation /
    greenstone (Wikipedia Catoctin Formation, USGS NRCS "RAVENROCK" soil series) via search.
    Additional titles surfaced in search results but were NOT opened directly and are cited only
    where a retrieved page corroborated them: Garrett M. Graff's book "Raven Rock" (2017),
    War History Online, National Interest, and the unofficial "whitehouse.gov1.info" Site-R tour
    page (NOT an official White House domain — treat as a hobbyist aggregation). No declassified
    FOIA PDF or GAO/congressional record was opened directly in this pass; declassified-document
    claims below are relayed through the secondary summaries that cited them and are labeled
    accordingly. Where a fact rests only on popular/enthusiast retellings it is capped at
    high-confidence inference or lower. No source URL in this file is fabricated.
  verdict: >-
    Raven Rock is a WELL-KNOWN PUBLIC LANDMARK with a solidly documented EXISTENCE, LOCATION,
    ERA, and MISSION — but a CLASSIFIED INTERIOR. This is the mirror image of the MainStreet
    America evidence position: there, the SHAPE and PROGRAM were verified and only the SURFACES
    were invented; here, the CONTEXT is verified and almost the ENTIRE INTERIOR must be invented.
    The public record firmly establishes that the facility exists, roughly where it is, what it
    is made of (Catoctin greenstone/metabasalt), when it was blasted out (1951-1953), the design
    principle (freestanding multi-story buildings on shock-isolation springs inside excavated
    caverns), the presence of several tunnel portals, the surface support base (Fort Ritchie,
    later Fort Detrick), and its continuity-of-government / Alternate National Military Command
    Center role. It does NOT establish the interior layout, tunnel geometry, exact building
    dimensions, or current systems — those are secret, and any build of them is approximation.
  what_is_well_established:
    - 'The facility EXISTS and is real: RRMC / "Site R" / the "underground Pentagon."'
    - 'General LOCATION: inside Raven Rock Mountain near Blue Ridge Summit, Liberty Township,
      Adams County, Pennsylvania; ~6 miles from Camp David; historically served from Fort Ritchie, MD.'
    - 'GEOLOGY: the mountain is Catoctin-Formation greenstone (a chlorite-rich metabasalt), not
      true granite despite the common "greenstone granite" phrasing.'
    - 'CONSTRUCTION ERA and COST: land seized 1951; blasted out 1951-1953; ~$35 million by 1954.'
    - 'The CORE DESIGN CONCEPT: freestanding multi-story ("three-story") buildings standing free of
      the cavern walls on large steel springs (seismic/shock isolation) inside blasted caverns.'
    - 'Several TUNNEL PORTALS/ENTRANCES exist (commonly cited as four; two visible in satellite imagery).'
    - 'MISSION: continuity-of-government / alternate military command; designated the Alternate
      National Military Command Center (ANMCC), a backup to the Pentagon''s command center.'
    - 'The 9/11 use: Vice President Cheney was moved to Raven Rock on/after September 11, 2001.'
    - 'Modern tenants/administration are public: Defense Threat Reduction Agency (largest tenant),
      114th Signal Battalion, Defense Information Systems Agency; garrison moved Ft Ritchie -> Ft Detrick (1997).'
  what_is_weak_or_missing:
    - 'The ENTIRE INTERIOR LAYOUT: room lists, corridor plans, which building holds what, vertical
      stacking, blast-door placement, chamber dimensions. CLASSIFIED. Any build version is invented.'
    - 'TUNNEL GEOMETRY: total length, cross-section, grade, how portals connect, cavern spacing.
      Sources say tunnels "curve gently" to blunt blast, and mention "over 3 miles of air-entrainment
      tunnels," but no map exists in public.'
    - 'EXACT BUILDING COUNT and DIMENSIONS: reliable sources say THREE buildings were completed in
      1953; popular retellings say FIVE three-story buildings. Even the count is contested (see conflicts).'
    - 'CURRENT SYSTEMS and CAPACITY: reservoirs, power plants, ventilation, and bed capacity are
      known to EXIST in concept, but specific counts/sizes vary wildly between enthusiast sources.'
    - 'PRECISE PORTAL POSITIONS, active defenses, personnel, and any operational-security detail —
      deliberately NOT researched or included (out of scope and rightly so).'
  bottom_line: >-
    A faithful reconstruction of the SETTING and CONCEPT is achievable and honest: a mountain of
    greenstone, tunnel portals in the hillside, and freestanding multi-story buildings perched on
    springs inside blasted caverns, performing an alternate-command mission. EVERYTHING SPATIAL AND
    INTERNAL — the room layout, corridor plan, tunnel network geometry, exact building sizes and
    contents — is CLASSIFIED and must be built as clearly-labeled CREATIVE APPROXIMATION. The build
    must present itself to visitors as an imaginative interpretation of a public landmark's public
    history, NOT as a leaked or accurate map of a secret facility. Do not present any invented
    corridor, room, or dimension as documented fact.

references:
  - id: REF-001
    subject: Existence & identity of the facility ("Site R" / "underground Pentagon")
    source_type: reference
    approximate_date: "2017 (encyclopedic; facility since 1953)"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      The Raven Rock Mountain Complex (RRMC), also called "Site R" and nicknamed the "underground
      Pentagon," is a real, publicly acknowledged U.S. military installation containing an underground
      command/relocation bunker. Corroborated across Wikipedia, PublicIntelligence, Grey Dynamics,
      War History Online, and Garrett M. Graff's 2017 book "Raven Rock." Its EXISTENCE and identity
      are not in doubt; only its interior is secret.

  - id: REF-002
    subject: Location (Blue Ridge Summit, Adams County PA; near Camp David / Fort Ritchie)
    source_type: reference
    approximate_date: "2017"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      Located inside Raven Rock Mountain near Blue Ridge Summit, Liberty Township, Adams County,
      Pennsylvania, close to the Maryland line. Mountain summit ~1,527-1,529 ft (465 m); Wikipedia
      gives summit coordinates 39 deg 44' 03" N, 77 deg 25' 11" W. Adjacent to Jacks Mountain, with
      Miney Branch between them (Potomac watershed). It is roughly 6 miles from Camp David and was
      historically administered from Fort Ritchie, Maryland. Location is public (published maps,
      satellite imagery); PRECISE portal coordinates are not treated as reliable here.

  - id: REF-003
    subject: Mountain geology (Catoctin greenstone / metabasalt, not true granite)
    source_type: reference
    approximate_date: "geological; sources 2018-2024"
    source_url: https://en.wikipedia.org/wiki/Catoctin_Formation
    corroborating_source_url: https://soilseries.sc.egov.usda.gov/OSD_Docs/R/Ravenrock.html   # USGS NRCS official "RAVENROCK" soil-series description ("derived from metabasalt (greenstone)") — independent second leg that keeps the verified geology label checkable
    confidence: verified
    observations: >-
      Raven Rock Mountain is part of the Blue Ridge and is capped by the Proterozoic Catoctin
      Formation, whose signature rock is GREENSTONE — a chlorite/actinolite/epidote-rich METABASALT
      named for its green color, NOT a granite. Corroborated by the USGS NRCS "RAVENROCK" soil series
      (soils formed in colluvium "derived from metabasalt (greenstone) and metarhyolite"). NOTE: many
      popular RRMC write-ups say the complex was blasted from "greenstone granite" — this conflates
      greenstone (metabasalt) with granite. For the build, the mountain body should read as dark
      greenish hard metabasalt. See conflicts (geology terminology).

  - id: REF-004
    subject: Construction era, land seizure, and cost
    source_type: reference
    approximate_date: "1951-1954"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      Approved under President Truman (1950). Land seized via a January 23, 1951 "Declaration of
      Taking" (case caption "United States of America v. 1,100 Acres of Land"); ~280 acres taken
      from four properties initially. Surface work began January 19, 1951; underground work
      February 24, 1951; the mountain was named "Raven Rock Mountain" May 26, 1951. Three underground
      buildings were completed in 1953; the Alternate Joint Communications Center (AJCC / "Site R")
      became operational in 1953. Development had reached ~$35,000,000 by April 1954 (~$350M+ today).
      S.A. Healy Company did the construction. Roughly a half-million cubic yards of greenstone were
      excavated and hauled away over ~10 months.

  - id: REF-005
    subject: Core design concept — freestanding multi-story buildings on giant springs in blasted caverns
    source_type: news
    approximate_date: "c.2011-2024 (design dates to 1950s)"
    source_url: https://greydynamics.com/us-secret-bases-raven-rock-mountain/
    confidence: high-confidence inference
    observations: >-
      The consistently reported design principle: separate freestanding multi-story buildings that
      stand CLEAR of the cavern walls and rest on large steel springs — a seismic/shock-isolation
      system meant to let the structures absorb the shock of a nearby detonation without collapsing;
      caverns separated by rock pillars; tunnels curve gently to blunt blast pressure. Reported by
      Grey Dynamics and multiple popular sources and consistent with Cold War hardened-facility
      engineering. Labeled high-confidence inference (not verified) because the SPRING/ISOLATION
      SPECIFICS come from secondary/enthusiast retellings, not an opened primary engineering document.
      This CONCEPT is the single most build-relevant public fact and is safe to render — the exact
      spring count, chamber sizes, and layout are NOT and must be approximated.

  - id: REF-006
    subject: Number and form of internal buildings (three vs five; "three-story")
    source_type: reference
    approximate_date: "1953 onward"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: moderate-confidence reconstruction
    observations: >-
      Wikipedia states "three underground buildings" were completed in 1953. Many popular sources
      (War History Online, Grey Dynamics, others) describe "FIVE three-story freestanding buildings"
      or "clusters of three-story structures." The buildings are consistently described as multi-story
      (commonly three stories) and designed to resemble ordinary office buildings. The exact final
      count is genuinely contested in public sources (initial three may have grown with later
      expansion, or popular sources may inflate). Recorded as a CONFLICT; the build should treat the
      building count and their arrangement as a design choice, not a documented fact. See conflicts.

  - id: REF-007
    subject: Tunnel portals / entrances (several; commonly four)
    source_type: other
    approximate_date: "2010 (imagery-based analysis)"
    source_url: https://publicintelligence.net/raven-rock-mountain-complex-site-r/
    confidence: high-confidence inference
    observations: >-
      Multiple sources describe several tunnel PORTALS into the mountain — most commonly FOUR
      (sometimes labeled A/B/C/D in enthusiast analyses), of which about TWO are said to be
      identifiable in public satellite imagery. PublicIntelligence also references "over 3 miles of
      air-entrainment tunnels" and surface access shafts (from a canceled 1979 improvement program).
      The EXISTENCE of several portals is well attested; the EXACT number, positions, and geometry are
      not authoritatively public, so this is inference. The build may show several hillside portals;
      their precise placement is a creative choice.

  - id: REF-008
    subject: Depth below summit and overall footprint (acreage)
    source_type: news
    approximate_date: "2017 (Graff-era reporting)"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    source_note: >-
      The Wikipedia page (source_url) carries the summit height and the land-action acreages (the ~280-acre
      taking and the 1,100-acre case caption) but does NOT itself state the "~650-acre compound" or the
      "~650 ft below summit" Graff-era figures. Those specifics are search-surfaced from secondary/press
      retellings (National Interest / Graff-era reporting) and were NOT fetched from a primary URL; no URL
      is fabricated for them, and they stay capped at high-confidence inference.
    confidence: high-confidence inference
    observations: >-
      Popular reporting places the complex roughly 650 feet BELOW the ~1,527 ft summit. The surface
      installation/compound is variously described as ~650 acres (Graff-era reporting) while the
      initial land action named 280 acres taken and a 1,100-acre case caption. These acreage figures
      describe different things (land seized vs total compound vs case caption) and should not be
      merged. Depth "~650 ft below summit" is widely repeated but rests on secondary sources, hence
      inference (see source_note: these specific figures are not carried by the Wikipedia source_url).
      Useful for the build only as justification that the bunker sits WELL below grade —
      consistent with placing it ~20 blocks beneath the surface plane in this world (see scale note).

  - id: REF-009
    subject: Self-sufficient utilities (reservoirs, power plants, ventilation, stores)
    source_type: news
    approximate_date: "c.2017-2024"
    source_url: https://greydynamics.com/us-secret-bases-raven-rock-mountain/
    confidence: high-confidence inference
    observations: >-
      The facility is described as a self-sufficient underground community able to seal off for
      months: underground water reservoirs (commonly "two"), on-site power generation ("dual power
      plants"), a sophisticated ventilation system, food reserves, medical/dining facilities, and —
      in the folklore — its own bar. The EXISTENCE of these self-sufficiency systems is a stable
      public theme; the SPECIFIC counts, capacities, and locations are not authoritatively public and
      vary between sources. High-confidence inference for existence; any specific reservoir size,
      generator layout, or capacity number in the build is creative approximation.

  - id: REF-010
    subject: Mission — continuity of government / Alternate National Military Command Center (ANMCC)
    source_type: reference
    approximate_date: "1962 onward"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      Purpose-built so the Department of Defense could regroup and exercise military command and
      control if the Pentagon were destroyed. Housed emergency operations centers for the Army, Navy,
      Air Force, and Marine Corps; designated the Alternate National Military Command Center (ANMCC)
      on October 1, 1962, operating alongside the Pentagon's National Military Command Center and the
      Cheyenne Mountain Complex. A continuity-of-government / alternate-command "shadow Pentagon."

  - id: REF-011
    subject: Modern tenants and administration
    source_type: reference
    approximate_date: "post-1995"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      Publicly documented tenants/administration: the Defense Threat Reduction Agency (largest
      tenant); the 114th Signal Battalion (manages ~38 communications systems on site); and the
      Defense Information Systems Agency (computing/services). Command lineage evolved from a Joint
      Support Command (1953) through redesignations to the 114th Signal Battalion after 1995.

  - id: REF-012
    subject: Surface support base (Fort Ritchie -> Fort Detrick; Site RT towers)
    source_type: reference
    approximate_date: "1953-1997"
    source_url: https://publicintelligence.net/raven-rock-mountain-complex-site-r/
    confidence: verified
    observations: >-
      Fort Ritchie, Maryland served as the administrative garrison / surface support base for Site R
      until 1997, when garrison support transferred to Fort Detrick, Maryland (Fort Ritchie closed via
      BRAC). "Site RT" denotes communications towers on the mountain summit. This is the surface
      support relationship called out in the task brief; the associated support base is real and public.

  - id: REF-013
    subject: September 11, 2001 use (Vice President Cheney relocated)
    source_type: reference
    approximate_date: "2001-09-11"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      After the September 11 attacks, Vice President Dick Cheney was moved to Raven Rock as a
      protected site, separated from President Bush; Deputy Secretary of Defense Paul Wolfowitz also
      relocated there. This is the facility's most famous confirmed real-world activation and is
      widely reported.

  - id: REF-014
    subject: Later expansions, renovations, and recent contracts
    source_type: news
    approximate_date: "1960s-2022"
    source_url: https://greydynamics.com/us-secret-bases-raven-rock-mountain/
    confidence: moderate-confidence reconstruction
    observations: >-
      The facility was hardened and expanded over decades (e.g., blast hardening to ~140 psi cited by
      1963; a 1955 War Room Annex; a canceled 1979 improvement program per PublicIntelligence). Recent
      enthusiast/press reporting cites continued investment: e.g., a 2018 "$45 million" figure and an
      August 2022 "$100 million" construction contract (Grunley Construction). These specific dollar
      and date figures come from secondary sources of mixed reliability and are recorded as
      moderate-confidence context, not verified specifics. They establish only that the site has been
      continuously maintained and modernized — no interior detail can be inferred from them.

  - id: REF-015
    subject: Legal prohibition on depicting the facility (2007 DoD policy) + classification of interior
    source_type: reference
    approximate_date: "2007-05-25"
    source_url: https://en.wikipedia.org/wiki/Raven_Rock_Mountain_Complex
    confidence: verified
    observations: >-
      As of May 25, 2007, DoD policy declared it unlawful "to make any photograph, sketch, picture,
      drawing, map or graphical representation of the Raven Rock Mountain Complex without first
      obtaining the necessary permission." Combined with the classified interior, this is the CENTRAL
      INTEGRITY FACT of this manifest: there is NO authoritative public interior map, and none is
      sought here. The Minecraft build is therefore an openly-labeled IMAGINATIVE reconstruction of a
      public landmark from PUBLIC-RECORD history and geology, explicitly NOT a claimed accurate
      depiction of the real (secret) interior. Any on-site signage must disclose this.

  - id: REF-016
    subject: Interior room layout, corridor plan, and contents
    source_type: other
    approximate_date: "n/a"
    source_url: none
    confidence: creative approximation
    observations: >-
      NO public source documents the interior floor plan, room list, corridor network, blast-door
      placement, vertical stacking of the multi-story buildings, or the contents of any chamber. This
      is CLASSIFIED. Every interior room, corridor, staircase, sign, and furnishing the build places
      is INVENTED and must be labeled a creative approximation. The build may use the PUBLIC CONCEPT
      (freestanding multi-story buildings on springs, connected by curving tunnels, with power/water/
      ventilation/dining/command functions) as a thematic scaffold, but no specific arrangement can be
      claimed as real.

  - id: REF-017
    subject: Tunnel network geometry and cavern dimensions
    source_type: other
    approximate_date: "n/a"
    source_url: none
    confidence: creative approximation
    observations: >-
      The total tunnel length, cross-section, gradient, cavern sizes, spacing, and how the several
      portals actually interconnect are not public. Public sources offer only qualitative hints
      ("tunnels curve gently to reduce blast effects"; "over 3 miles of air-entrainment tunnels").
      Any specific tunnel geometry, cavern footprint, or portal-to-portal routing in the build is a
      creative approximation and must be labeled as such.

  - id: REF-018
    subject: Garrett M. Graff, "Raven Rock" (2017) — principal public secondary source
    source_type: book
    approximate_date: "2017"
    source_url: https://www.amazon.com/Raven-Rock-Governments-Secret-Itself-While/dp/1476735409
    confidence: verified
    observations: >-
      Garrett M. Graff's "Raven Rock: The Story of the U.S. Government's Secret Plan to Save Itself —
      While the Rest of Us Die" (Simon & Schuster, 2017) is the most substantial public work on the
      subject, built on declassified documents, interviews, and site visits. It is the canonical
      public history and the recommended deeper source for the build's contextual/signage narrative.
      NOTE: the book text itself was NOT opened in this research pass (only its existence/description
      via search); factual claims above are drawn from the retrieved web sources, not from quoting Graff.

conflicts:
  - topic: Geology terminology ("greenstone granite")
    popular_value: "Blasted out of 'greenstone granite'"
    popular_source: "War History Online; Grey Dynamics; many popular RRMC write-ups"
    corrected_value: "Catoctin-Formation GREENSTONE = a chlorite-rich METABASALT, not a granite"
    corrected_source: "Wikipedia (Catoctin Formation); USGS NRCS 'RAVENROCK' soil series"
    note: >-
      "Greenstone granite" is a lay conflation. Geologically the mountain is greenstone (metabasalt).
      The build should read as dark greenish hard metabasalt; do not model it as pink/gray granite.

  - topic: Number of internal buildings
    reliable_value: "THREE underground buildings completed in 1953"
    reliable_source: "Wikipedia (citing facility history)"
    popular_value: "FIVE three-story freestanding buildings"
    popular_source: "War History Online; Grey Dynamics; enthusiast retellings"
    note: >-
      Genuinely contested in public sources. The initial count may have grown with later expansion,
      or popular sources may overstate. Building count is a build DESIGN CHOICE, not documented fact.

  - topic: Facility footprint / acreage
    value_a: "280 acres seized initially (four properties)"
    source_a: "Wikipedia (Declaration of Taking, 1951)"
    value_b: "'1,100 Acres of Land' (federal case caption); ~650-acre compound (Graff-era reporting)"
    source_b: "Wikipedia case caption; National Interest / Graff-era press"
    note: >-
      Different measures (land seized vs case caption vs total compound). Not merged. None of these
      constrains the underground footprint, which is unknown.

  - topic: Depth below summit
    value_a: "~650 ft below the ~1,527 ft summit"
    source_a: "Popular reporting (Graff-era); enthusiast sites"
    value_b: "Not authoritatively specified in primary public documents"
    source_b: "(absence)"
    note: "Widely repeated but secondary. Use only to justify a deep sub-surface placement, not an exact depth."

  - topic: Self-sufficiency system counts (reservoirs, power plants, capacity)
    value_a: "Two reservoirs; dual power plants; beds for ~2,000-3,000"
    source_a: "Grey Dynamics; assorted popular sources"
    value_b: "Existence agreed; exact counts vary source-to-source"
    source_b: "(cross-source variance)"
    note: "Existence is stable; specific numbers are not reliable. Any count in the build is approximation."

  - topic: Recent investment figures
    value_a: "2018 '$45M'; 2022 '$100M' Grunley contract"
    source_a: "Grey Dynamics (secondary)"
    value_b: "Not independently verified here"
    source_b: "(unopened primary contract records)"
    note: "Recorded as context only; establishes ongoing modernization, nothing about interior form."

