# BUILD-SCALE NOTE (inherited from MainStreet America; for the later design layer, not evidence):
#   1 horizontal block ~= 2 real feet; ~5 blocks of height per story; world envelope X,Z in
#   [-300,+300]; surface build plane y=64. Raven Rock occupies the SUB-SURFACE (roughly y~40 and
#   below, ~20 blocks beneath the MainStreet America surface build). The ~650-ft real depth (REF-008)
#   is NOT reproduced literally (that would be ~325 blocks down and off-envelope); the ~20-block
#   burial is a deliberate build convention standing in for "deep inside the mountain." Any coordinate,
#   dimension, room, or tunnel the design layer adds is CREATIVE APPROXIMATION per REF-016/REF-017 and
#   must be labeled as such to visitors. This evidence layer sets no coordinates.
