  classification: pedestrian/shared-street cross-link
  standards:
    - ST-01 connected hierarchy
    - ST-02 three-block minimum cross street
    - ST-03 block and connection interval
    - ST-04 compact intersection
    - ST-07 bidirectional walkable grade
    - WF-02 decision information before a choice
  rejected_alternatives:
    - id: R08-FULL-R02-R03
      decision: rejected
      reason: A straight x=-80..82 connection would breach both outer neighborhood fences and create unnecessary R02/R03 curb work.
    - id: R08-STRAIGHT-Z124
      decision: rejected
      reason: A straight z=-124 cross-link would remove two authored sea-lantern gateway markers and intersect the central fence at visually weak locations.
    - id: R08-EXISTING-GATE-Z147
      decision: rejected
      reason: The existing five-wide central gate aligns with the registered Timbergrove and Midtown building envelopes.
    - id: R02-WIDENING
      decision: deferred
      reason: The standards explicitly make widening a study, not a presumption; fence, property, and grade risk exceed this wave's benefit.

