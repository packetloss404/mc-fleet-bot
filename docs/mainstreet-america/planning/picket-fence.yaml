# MainStreet America — white-picket-fence campus boundary
#
# STATUS: BUILT AND AUDITED 2026-07-26. The terrain-following generator preserved
# all five gates, routed around vegetation, and closed every steep grade transition.
#
# This is a Minecraft campus boundary, not a claim about the surveyed line of the
# historical 12.41-acre Spring, Texas parcel. The documented 600x600 project
# envelope is deliberately larger than the historical parcel.

schema_version: 1
id: mainstreet-america-picket-fence
world: world
status: complete

evidence:
  snapshot:
    taken_utc: "2026-07-26"
    command: "python3 scripts/world_snapshot.py --near=0,0 --radius 350"
    regions: data/worldsnap/region
  live_control_records:
    markers: 0
    zones: 0
    routes: 0
    note: >-
      GET /api/markers, /api/zones, and /api/routes were empty at survey time.
      The fence therefore cannot safely inherit a live database boundary.
  observed_site:
    - "MainStreet spine and homes occupy the central north/south band."
    - "The parking field reaches roughly x +/-125 and z +268."
    - "The warehouse occupies the rear/north end near z -280."
    - >-
      The earth-covered east complex reaches the +X project edge. A fence tight
      around only the central homes would cut through active project grounds.
  authority_note: >-
    Fresh world geometry outranks stale planned GRID/OVAL coordinates. The
    outside-of-envelope alignment below was selected to avoid existing structures
    and preserve all four Raven Rock approach corridors.

boundary:
  type: axis_aligned_ring
  relation_to_project_envelope: "5 blocks outside x/z [-300,+300]"
  historical_parcel_claim: false
  corners_clockwise:
    - {x: -305, z: -305}
    - {x: 305, z: -305}
    - {x: 305, z: 305}
    - {x: -305, z: 305}
  gross_columns_including_corners_once: 2440
  rationale:
    - "Encloses the central campus and the earth-covered east complex."
    - "Leaves a five-block maintenance apron outside the documented envelope."
    - "Does not place fence blocks inside the four portal construction boxes."
    - "Keeps the boundary legible as one campus instead of fencing each home lot."

gates:
  - id: south-main-drive
    side: south
    fixed_coordinate: {z: 305}
    opening_axis: x
    opening_min: -10
    opening_max: 10
    width: 21
    purpose: "formal two-way visitor entrance aligned to the x=0 arrival drive"
    treatment: "two 3-block-high white piers, lantern caps, permanently clear carriageway"

  - id: south-service-and-n3
    side: south
    fixed_coordinate: {z: 305}
    opening_axis: x
    opening_min: -159
    opening_max: -141
    width: 19
    purpose: "service entrance aligned to Raven Rock N3 at (-150,18,+285)"
    protected_approach: "N3 construction box x[-157,-143] z[286,299]"
    treatment: "white piers; no arch or closed gate over emergency/service clearance"

  - id: north-vehicle-and-n4
    side: north
    fixed_coordinate: {z: -305}
    opening_axis: x
    opening_min: -9
    opening_max: 9
    width: 19
    purpose: "vehicle/emergency entrance aligned to Raven Rock N4 at (0,18,-285)"
    protected_approach: "N4 construction box x[-7,7] z[-298,-286]"
    treatment: "white piers; preserve full vehicle headroom and turning clearance"

  - id: east-service-and-n5
    side: east
    fixed_coordinate: {x: 305}
    opening_axis: z
    opening_min: -39
    opening_max: -21
    width: 19
    purpose: "service/emergency entrance aligned to Raven Rock N5 at (+285,18,-30)"
    treatment: "white piers; keep clear for the existing east tunnel approach"

  - id: west-future-utility-and-n6
    side: west
    fixed_coordinate: {x: -305}
    opening_axis: z
    opening_min: -4
    opening_max: 14
    width: 19
    purpose: "reserved utility opening aligned to Raven Rock N6 at (-290,10,+5)"
    caveat: >-
      N6 is presently flooded and bulkheaded. Keep this opening as a signed,
      fenced-off future utility reserve; it is not a visitor entrance.

terrain_following:
  required: true
  fixed_y_forbidden: true
  placement_plane: "one block above the highest safe support surface per column"
  rules:
    - "Read heights from a fresh local region snapshot; do not probe unloaded chunks as absence."
    - "Never place on top of leaves, logs, flowers, snow layers, or other replaceable vegetation."
    - "Never overwrite an existing non-replaceable block; use keep-only constructive ops."
    - "If a tree or structure occupies the line, jog outward by 1..4 blocks, never inward."
    - >-
      If all four outward lanes remain blocked by the same canopy, the selected
      detour may exact-mask prune only intersecting leaves, mangrove roots, or
      muddy mangrove roots. Never cut a log, structure block, or unguarded block.
    - "Where adjacent fence bases differ by more than one block, use a stepped white pier."
    - >-
      Across water, carry the fence on a one-block-wide smooth-stone plinth at
      water-surface level. Do not drain, fill, or divide the water body.
    - "Keep every listed gate opening clear from ground to y+5."
    - "Do not modify blocks inside the MSA/Raven Rock envelope while forming the exterior apron."

appearance:
  intent: "upscale white-picket campus fence, readable in vanilla Minecraft"
  vanilla_constraint: "Minecraft has no true white wooden fence block."
  field:
    block: birch_fence
    height: 1
    note: "pale birch is the closest vanilla wooden-picket material"
  posts:
    block: white_concrete
    spacing: 12
    height: 2
    cap: smooth_quartz_slab
  corner_posts:
    block: quartz_pillar
    height: 3
    cap: smooth_quartz_stairs
  gate_piers:
    block: quartz_pillar
    height: 3
    cap: smooth_quartz_stairs
    light: lantern
  water_plinth:
    block: smooth_stone
    width: 1
  landscaping:
    scope: "inside face for 24 blocks on each side of the south main gate only"
    blocks: [azalea_leaves, flowering_azalea_leaves]
    note: "do not run a 2,400-block hedge; it would hide the pickets and inflate scope"

estimated_materials:
  # Exact values depend on terrain jogs and water plinths. These are procurement
  # estimates for the reviewed square alignment and five openings.
  open_columns: 97
  enclosed_fence_columns_before_post_substitution: 2343
  white_posts_approx: 210
  birch_fence_approx: 2140
  white_concrete_approx: 430
  smooth_quartz_slab_approx: 210
  quartz_pillar_for_corners_and_gates_approx: 42
  lanterns: 10
  water_plinth: "derive from the fresh terrain pass"
  survival_equivalent:
    birch_logs_for_fence_approx: 892
    current_fleet_birch_logs_at_survey: 84
    current_fleet_white_concrete_at_survey: 0
    shortfall_note: >-
      Current birch stock can craft only about 200 fence pieces, under 10% of
      the estimated requirement. Use reviewed RCON construction for this
      deterministic civic boundary, or create a dedicated supply chain before
      assigning survival builders.

execution:
  live_mutation_authorized: true
  preferred_channel: "scripts/rcon_runner.py after reviewed generation"
  reason: >-
    The current world-building handoff measures RCON at roughly 0.002 seconds per
    command and records repeated silent failures in bot/WorldEdit workflows. RCON
    also avoids consuming an unavailable 800+ birch-log shortfall.
  phases:
    - id: F0
      name: "preflight and collision map"
      actions:
        - "Confirm no build_runner, rcon_runner, or sequencer is active."
        - "Take a durable fresh snapshot covering x/z +/-320."
        - "Generate terrain-following keep-only ops and a skipped-collision report."
        - "Review all jogs, all water-plinth columns, and all five gate clearances."
      assigned_roles:
        Surveyor: "height/collision report"
        Scout: "gate and approach review"

    - id: F1
      name: "32-block visual pilot"
      scope: "south side, z=305, x=20..51"
      actions:
        - "Place only the pilot segment."
        - "Refresh the snapshot and render daylight perspectives from both sides."
        - "Approve picket/post cadence before generating the full perimeter."
      rollback: "WorldEdit undo if used; otherwise restore only the pilot from the preflight snapshot"

    - id: F2
      name: "cardinal runs"
      parallel_crews:
        Mason: "north side, excluding the N4 gate"
        Steward: "south side, excluding both south gates and the approved pilot"
        Surveyor: "west side, excluding the N6 reserve"
        Scout: "east side, excluding the N5 gate and watching the earth-covered complex"
        Architect: >-
          gate piers and corners only after the current disconnect/quarantine state
          is resolved; the build must not depend on Architect being available
      note: >-
        These are inspection/ownership assignments even when RCON places the
        blocks. Do not make five bots independently improvise coordinates.

    - id: F3
      name: "gates, signs, and entrance landscaping"
      actions:
        - "Build piers without reducing any listed opening."
        - "Mark N6 as flooded/closed, not as a usable entrance."
        - "Add only the short south-gateway hedge treatment."

    - id: F4
      name: "acceptance"
      actions:
        - "Refresh the region snapshot."
        - "Census all four perimeter strips and compare to generated expected counts."
        - "Render a top-down map and four gate perspectives."
        - "Verify every gate is open in both directions and has five blocks of headroom."
        - "Register the completed fence as one canonical build unit; do not track per-edge migration batches."

acceptance:
  - "No existing non-replaceable block was overwritten."
  - "No fence block lies inside a declared gate opening."
  - "All four corners are closed."
  - "All non-gate boundary columns contain a connected barrier."
  - "No unsupported or floating fence columns."
  - "No fence rests on foliage."
  - "All five openings remain traversable in both directions."
  - "The east run clears the earth-covered complex and its maintenance apron."
  - "The top-down render reads as one continuous campus boundary."
  - "The site signage labels this as a reconstruction boundary, not the historical surveyed parcel."

as_built:
  completed_utc: "2026-07-26T16:19:00Z"
  operations: data/buildops/msa_picket_fence_full.txt
  generator_report: data/buildops/msa_picket_fence_full.report.json
  audit_result: docs/mainstreet-america/qa/audit-final-2026-07-26.json
  rcon_result: "2143 commands successful; 0 failed"
  columns: {required: 2343, routed: 2343, skipped: 0}
  topology: {components: 5, expected_components: 5, unresolved_grade_barriers: 0}
  gates: {openings: 5, opening_columns: 97, piers: 10}
