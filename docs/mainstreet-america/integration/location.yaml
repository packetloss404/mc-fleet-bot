#   nor are Dynmap/BlueMap, EssentialsX or Citizens, so nothing here is live and this file waits on the
#   relay plugin. CORRECTED 2026-07-25: two side-claims above were FALSE — **WorldEdit 7.4.0 and
#   WorldGuard 7.0.16 ARE installed**, and the **builder bots ARE opped (level 4)**. Overworld name is
#   confirmed `world`. See ../../raven-rock/qa/oq3-worldguard.md.
#
# -----------------------------------------------------------------------------------------------------
# PROVENANCE / HONESTY NOTE  (read before trusting this file)
# -----------------------------------------------------------------------------------------------------
# The task cited "the full bot-readable location record from section 17 including every alias phrase
# listed." NO brief and NO "section 17" exist in this repository — only ../references/manifest.yaml,
# ../references/README.md and the planning/ files. This is the SAME gap the coordinates.yaml author
# recorded as CONFLICT-02 and the palettes.yaml author recorded as A01. I therefore AUTHORED this record
# (including the alias set) from the verified manifest and planning/coordinates.yaml, rather than
