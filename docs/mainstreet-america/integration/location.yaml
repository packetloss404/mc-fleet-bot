# below; there was no external list to copy. A cross-checking agent should treat the alias SET and the
# spoken copy as reasoned construction, not a canonical transcription.
#
# CONFIDENCE VOCABULARY (inherited from the manifest; never upgraded):
#   verified                           - primary/multi-source
#   high-confidence inference          - one good source / a strong read
#   moderate-confidence reconstruction - assembled from snippets
#   creative approximation             - no evidence; invented for the build
