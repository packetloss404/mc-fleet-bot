<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690"><rect width="960" height="690" fill="#0d1523"/><style>.h{font:700 24px system-ui;fill:#eff7ff}.s{font:13px ui-monospace,monospace;fill:#c7d8e7}.t{font:11px ui-monospace,monospace;fill:#dceaf4}</style><text x="32" y="39" class="h">C01 public vertical — 5×5 protected switchback and independent return</text><text x="32" y="64" class="s">post-C01-08 source-bound design only · no operation or mutation authority</text><rect x="70" y="104" width="800" height="420" fill="#142238" stroke="#5b738b"/><path d="M305 50 L352 50 L399 50 L446 50 L493 50 L540 50 L587 50 L634 50 L681 50 L728 50 L775 50 L775 68 L775 86 L775 104 L775 122 L775 140 L775 158 L775 176 L728 176 L681 176 L634 176 L587 176 L540 176 L493 176 L446 176 L399 176 L352 176 L305 176 L258 176 L211 176" fill="none" stroke="#65c7ff" stroke-width="38" opacity=".27"/><path d="M305 356 L352 356 L399 356 L446 356 L493 356 L540 356 L587 356 L634 356 L681 356 L728 356 L775 356 L775 374 L775 392 L775 410 L775 428 L775 446 L728 446 L681 446 L634 446 L587 446 L540 446 L493 446 L446 446 L399 446 L352 446 L305 446 L258 446 L211 446" fill="none" stroke="#68d391" stroke-width="38" opacity=".27"/><path d="M305 50 L352 50 L399 50 L446 50 L493 50 L540 50 L587 50 L634 50 L681 50 L728 50 L775 50 L775 68 L775 86 L775 104 L775 122 L775 140 L775 158 L775 176 L728 176 L681 176 L634 176 L587 176 L540 176 L493 176 L446 176 L399 176 L352 176 L305 176 L258 176 L211 176" fill="none" stroke="#65c7ff" stroke-width="5"/><path d="M305 356 L352 356 L399 356 L446 356 L493 356 L540 356 L587 356 L634 356 L681 356 L728 356 L775 356 L775 374 L775 392 L775 410 L775 428 L775 446 L728 446 L681 446 L634 446 L587 446 L540 446 L493 446 L446 446 L399 446 L352 446 L305 446 L258 446 L211 446" fill="none" stroke="#68d391" stroke-width="5"/><path d="M305 356 L305 50" fill="none" stroke="#eab968" stroke-width="5" stroke-dasharray="8 5"/><path d="M211 446 L211 176" fill="none" stroke="#eab968" stroke-width="5" stroke-dasharray="8 5"/><circle cx="305" cy="50" r="9" fill="#65c7ff"/><circle cx="211" cy="176" r="9" fill="#65c7ff"/><circle cx="305" cy="356" r="9" fill="#68d391"/><circle cx="211" cy="446" r="9" fill="#68d391"/><text x="32" y="562" class="s"><tspan fill="#65c7ff">Blue</tspan>: 30-station future main protected switchback. <tspan fill="#68d391">Green</tspan>: 28-station separately built independent return; both are 5-wide × 5-clear-high.</text><text x="32" y="589" class="s"><tspan fill="#eab968">Gold dashed</tspan>: retained existing 5-wide × 5-clear-high upper/lower landing connectors. Main and return target cells and one-cell interaction halos do not intersect.</text><text x="32" y="616" class="s">The return target is disjoint from the current protected switchback’s 3D interior halo; it must be post-state-proven before any main-route replacement package.</text><text x="32" y="654" class="t">Main interfaces: [839,43,-47] / [837,25,-54] · return interfaces: [839,43,-64] / [837,25,-69]</text></svg>
