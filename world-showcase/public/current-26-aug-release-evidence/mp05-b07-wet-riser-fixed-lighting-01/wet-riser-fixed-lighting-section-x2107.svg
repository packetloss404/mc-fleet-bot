<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680"><style>.t{font:700 18px Arial}.s{font:12px Arial;fill:#34495e}.m{font:11px monospace;fill:#243746}</style><rect width="100%" height="100%" fill="#fff"/><text x="24" y="30" class="t">B07 wet riser — sealed west-wall fixed-light section</text><text x="24" y="50" class="s">Three full solid fixtures; ladder core and three closed receiver hatches retained</text><rect x="175" y="120" width="34" height="500" fill="#34495e"/><rect x="210" y="120" width="160" height="500" fill="#eaf5fb"/><rect x="370" y="120" width="34" height="500" fill="#34495e"/><rect x="210" y="506" width="34" height="32" fill="#ffd84a" stroke="#7b5a00"/><text x="260" y="528" class="m">L y=11</text><rect x="210" y="380" width="34" height="32" fill="#ffd84a" stroke="#7b5a00"/><text x="260" y="402" class="m">L y=14</text><rect x="210" y="254" width="34" height="32" fill="#ffd84a" stroke="#7b5a00"/><text x="260" y="276" class="m">L y=17</text><rect x="210" y="78" width="160" height="40" fill="#b9770e"/><text x="215" y="102" class="m">three closed oak receiver hatches at y=18</text><text x="24" y="655" class="s">No water/lava, route width, core, ladder, hatch, closure, receiver, exterior, public, egress, or transport state changes.</text></svg>