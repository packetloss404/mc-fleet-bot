<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740"><style>.title{font:700 22px system-ui;fill:#f1f5f9}.sub{font:13px system-ui;fill:#cbd5e1}.label{font:600 12px system-ui;fill:#f8fafc}.small{font:11px system-ui;fill:#cbd5e1}</style><rect width="100%" height="100%" fill="#091321"/><text x="34" y="38" class="title">SYS03 PC-01 — Cobalt Westlight ↔ Ravensreach platform/access readiness</text><text x="34" y="61" class="sub">Observed source volumes and required future interfaces; candidate only, no platform/access construction authority.</text><rect x="90" y="104" width="1060" height="470" fill="#12263a" stroke="#436277"/><rect x="171.53846153846155" y="146.72727272727272" width="106" height="64.0909090909091" fill="#facc1544" stroke="#facc15" stroke-width="2"/><text x="175.53846153846155" y="161.72727272727272" class="label">WL surveyed surface area</text> <rect x="220.46153846153848" y="253.54545454545453" width="154.92307692307688" height="25.636363636363654" fill="#22c55e44" stroke="#22c55e" stroke-width="2"/><text x="224.46153846153848" y="268.5454545454545" class="label">WL built platform liner</text> <rect x="220.46153846153848" y="180.9090909090909" width="807.2307692307692" height="324.72727272727275" fill="#38bdf844" stroke="#38bdf8" stroke-width="2"/><text x="224.46153846153848" y="195.9090909090909" class="label">sealed service corridor</text> <rect x="970.6153846153846" y="445.8181818181818" width="106.00000000000011" height="55.54545454545456" fill="#facc1544" stroke="#facc15" stroke-width="2"/><text x="974.6153846153846" y="460.8181818181818" class="label">RR surveyed station area</text> <rect x="986.9230769230769" y="480" width="40.76923076923072" height="21.363636363636374" fill="#fb718544" stroke="#fb7185" stroke-width="2"/><text x="990.9230769230769" y="495" class="label">RR-SE-1 service only</text> <rect x="1027.6923076923076" y="488.54545454545456" width="40.769230769230944" height="12.818181818181813" fill="#a78bfa44" stroke="#a78bfa" stroke-width="2"/><text x="1031.6923076923076" y="503.54545454545456" class="label">RR-SE-2 public-route input</text><text x="90" y="610" class="label">Public/service rule: RR-SE-1 is protected service/rescue only. RR-SE-2 is a surveyed public-route input but has a 3×3 surface pad, not an accepted 5×5 concourse.</text><text x="90" y="635" class="small">All four public 5×5 endpoint contracts remain UNBOUND and require fresh source states, target states, exact inverse, protected/BE/entity clearances, and post-state normal-walk returns.</text><text x="90" y="660" class="small">No passive rail, sealed sleeve, platform liner, or service corridor is a public station, passenger guideway, power system, or commissioned return.</text></svg>
