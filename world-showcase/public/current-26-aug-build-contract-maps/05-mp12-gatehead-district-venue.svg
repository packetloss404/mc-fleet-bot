  <text class="tiny" x="44" y="646">Source: complete immutable SYS03 post snapshot captured 2026-08-26T15:32:56Z · region SHA-256 3e0d739e5ceda6fb9a828e9b5947e15d00864f7f15f54d1c099e011477e3bcfd</text>
