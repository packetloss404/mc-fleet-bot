<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">MP12 Gatehead district-to-venue interface decision map</title>
  <desc id="desc">Coordinate schematic of the protected north Gatehead facade, already-built southern alignment, East Arrival and separately unaccepted Westlight Venue boundary. It authorizes no construction.</desc>
  <style>
    .bg { fill: #101720; } .panel { fill: #182333; stroke: #405369; stroke-width: 2; }
    .grid { stroke: #2c3c50; stroke-width: 1; } .fa { fill: #a94c4c; stroke: #f08a8a; stroke-width: 2; }
    .route { fill: #2f806d; stroke: #86dfc6; stroke-width: 2; } .portal { fill: #3c7498; stroke: #95d9ff; stroke-width: 2; }
    .venue { fill: #6d4f87; stroke: #caabf5; stroke-width: 2; stroke-dasharray: 7 5; }
    .hold { fill: #6f3c42; stroke: #f19999; stroke-width: 2; } .anchor { fill: #f8d778; stroke: #fff0a6; stroke-width: 2; }
    text { fill: #ecf3fa; font-family: Arial, sans-serif; } .h { font-size: 28px; font-weight: bold; }
    .s { font-size: 16px; } .m { font-size: 14px; } .tiny { font-size: 12px; fill: #c6d5e5; }
    .muted { fill: #aebfd1; } .red { fill: #ffabab; } .green { fill: #a6ead5; } .yellow { fill: #ffe59a; }
  </style>
