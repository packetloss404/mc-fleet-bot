69,−552)</text><rect x="810" y="90" width="230" height="470" rx="8" fill="#111827" stroke="#64748b"/><text x="830" y="122" class="h">Five unassigned interfaces</text><text x="830" y="160" class="s">LW-HYDRO-01 — basin/overflow</text><text x="830" y="207" class="s">LW-DISPLACEMENT-01 — 186 cells</text><text x="830" y="254" class="s">LW-HALO-01 — 593 fluids</text><text x="830" y="301" class="s">LW-NORTH-GRADE-01 — 21 blockers</text><text x="830" y="348" class="s">LW-TEMPIETTO-LANDING-01</text><text x="70" y="651" class="h">No operations. No release authority. No water, deck, landing, lighting, or ownership mutation.</text><text x="70" y="679" class="s">Required sequence: source-bound ownership + full hydrology → containment/drainage → grade/landing → guarded inverse package.</text></svg>
