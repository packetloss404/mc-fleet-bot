  <text x="135" y="115" class="label">High-15 interface</text><text x="135" y="188" class="note">36 PDS migration cells</text><text x="135" y="212" class="note">30 ingress-air retained</text><text x="135" y="236" class="note">36 route-air preserved</text>
  <rect x="450" y="410" width="385" height="126" rx="10" class="box"/><text x="475" y="441" class="label">Required staged operation</text><text x="475" y="467" class="note">1. shell/gravity lock: 1,638 cells, bottom-up</text><text x="475" y="491" class="note">2. core clear: 3,227 cells, top-down</text><text x="475" y="515" class="note">rollback: core restore, then shell restore</text>
  <rect x="905" y="95" width="395" height="184" rx="10" class="warn"/><text x="930" y="127" class="label">Upper band remains held</text><text x="930" y="153" class="note">All 108 high 6×6 alternatives have full-envelope water.</text><text x="930" y="178" class="note">The cyan descent avoids that band; it does not drain, line,</text><text x="930" y="203" class="note">or reclassify it. It must not be merged with the water hold.</text><text x="930" y="236" class="note">No rail, service opening, or passenger authority follows.</text>
  <text x="80" y="680" class="note">Current static proof: 107 gravity chains remain supported; 0 fluid, unknown-air, protected-target, block-entity, and saved-entity hits in the 6,921-cell envelope. A fresh live release kernel remains mandatory.</text>
