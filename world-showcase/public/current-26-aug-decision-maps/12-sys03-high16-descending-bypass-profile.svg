  <style>.bg{fill:#09131d}.grid{stroke:#25455b;stroke-width:1}.title{fill:#f8fafc;font:700 29px system-ui,sans-serif}.sub{fill:#c8dbe7;font:16px system-ui,sans-serif}.axis{fill:#a6c4d6;font:14px system-ui,sans-serif}.label{fill:#f8fafc;font:700 17px system-ui,sans-serif}.note{fill:#c8dbe7;font:15px system-ui,sans-serif}.route{fill:none;stroke:#22d3ee;stroke-width:7;stroke-linejoin:round}.shell{stroke:#a3e635;stroke-width:10;stroke-linecap:round}.air{fill:#38bdf8}.migrate{fill:#fbbf24}.warn{fill:#4a2316;stroke:#fb923c;stroke-width:1.5}.box{fill:#102233;stroke:#3b627e;stroke-width:1.5}</style>
  <rect width="100%" height="100%" class="bg"/><text x="70" y="42" class="title">SYS-03 · High-16 descending bypass: staged gravity + ownership profile</text><text x="70" y="67" class="sub">The horizontal dimension is schematic. Y levels, interface counts, and execution order are source-bound.</text>
  <line x1="90" y1="150" x2="1320" y2="150" class="grid"/><line x1="90" y1="260" x2="1320" y2="260" class="grid"/><line x1="90" y1="370" x2="1320" y2="370" class="grid"/><line x1="90" y1="480" x2="1320" y2="480" class="grid"/><line x1="90" y1="590" x2="1320" y2="590" class="grid"/><text x="18" y="155" class="axis">Y=54</text><text x="18" y="265" class="axis">Y=49</text><text x="18" y="375" class="axis">Y=44</text><text x="18" y="485" class="axis">Y=39</text><text x="18" y="595" class="axis">Y=34</text>
