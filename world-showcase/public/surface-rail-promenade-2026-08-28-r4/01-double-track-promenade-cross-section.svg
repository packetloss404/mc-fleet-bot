<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <style>
    .bg{fill:#101827}.panel{fill:#172235;stroke:#64748b;stroke-width:2}.title{fill:#f8fafc;font:700 28px system-ui}.sub{fill:#cbd5e1;font:15px system-ui}.label{fill:#f8fafc;font:700 14px system-ui}.note{fill:#dbeafe;font:13px ui-monospace,monospace}.danger{fill:#fecaca;font:700 14px system-ui}.service{fill:#475569}.walk{fill:#22c55e}.barrier{fill:#f59e0b}.track{fill:#64748b}.rail{fill:#e5e7eb}.platform{fill:#60a5fa}.loop{fill:none;stroke:#c084fc;stroke-width:10}.main{fill:none;stroke:#e5e7eb;stroke-width:7}.dash{stroke-dasharray:12 8}
  </style>
  <rect class="bg" width="1500" height="960"/>
  <text x="45" y="45" class="title">Above-ground double-track rail + protected walking path</text>
  <text x="45" y="71" class="sub">Reference module only · X offsets / route chainage are design coordinates, not world coordinates</text>
  <rect class="panel" x="40" y="105" width="1420" height="310" rx="8"/>
  <text x="65" y="140" class="title" style="font-size:21px">Running-segment cross-section (23 blocks wide; rail level R)</text>
  <rect class="service" x="90" y="185" width="240" height="150"/><rect class="barrier" x="330" y="185" width="40" height="150"/>
  <rect class="walk" x="370" y="185" width="200" height="150"/><rect class="barrier" x="570" y="185" width="40" height="150"/>
  <rect class="track" x="610" y="185" width="160" height="150"/><rect class="track" x="770" y="185" width="80" height="150"/><rect class="track" x="850" y="185" width="160" height="150"/>
  <rect class="rail" x="685" y="205" width="18" height="110"/><rect class="rail" x="925" y="205" width="18" height="110"/>
  <text x="160" y="255" class="label">0–5 SERVICE GALLERY</text><text x="165" y="278" class="note">6 clear × 6 clear</text>
  <text x="385" y="255" class="label">7–11 PROTECTED PATH</text><text x="420" y="278" class="note">5 clear wide</text>
  <text x="625" y="255" class="label">TRACK A</text><text x="650" y="278" class="note">rail X=15</text>
  <text x="870" y="255" class="label">TRACK B</text><text x="892" y="278" class="note">rail X=20</text>
  <text x="330" y="360" class="danger">opaque separation wall</text><text x="555" y="360" class="danger">2-high rail barrier</text>
  <text x="1035" y="214" class="label">Vertical reference</text><text x="1035" y="242" class="note">rails: Y=R</text><text x="1035" y="266" class="note">support/deck: Y=R−1</text><text x="1035" y="290" class="note">guideway clear: R+1…R+5</text><text x="1035" y="314" class="note">slab walk surface: R+½</text><text x="1035" y="350" class="danger">No rail walking / no unapproved wall gaps</text>
  <rect class="panel" x="40" y="445" width="880" height="460" rx="8"/>
  <text x="65" y="480" class="title" style="font-size:21px">Terminal throat and one-way turnback loop — plan view</text>
  <text x="65" y="505" class="sub">parallel, level platform approaches; all decisions outside platform stopping space</text>
  <path class="main" d="M90 635 H330 H530"/><path class="main" d="M90 735 H330 H530"/>
  <rect class="platform" x="330" y="570" width="250" height="55"/><rect class="platform" x="330" y="745" width="250" height="55"/>
  <text x="350" y="603" class="label">Platform 1 · 48-level tangent</text><text x="350" y="778" class="label">Platform 2 · 48-level tangent</text>
  <rect class="barrier" x="585" y="600" width="72" height="70"/><text x="592" y="642" class="note">12-block tail</text>
  <path class="loop" d="M530 635 H655 Q740 635 740 720 Q740 805 655 805 H530"/>
  <text x="600" y="850" class="label">unloaded-cart one-way loop</text>
  <path class="dash" d="M120 560 H680" stroke="#22c55e" stroke-width="16"/><text x="118" y="548" class="note">protected path continues beside Track A</text>
  <path class="dash" d="M120 525 H680" stroke="#64748b" stroke-width="20"/><text x="118" y="510" class="note">separate 6×6 service gallery + controlled access to tail/loop</text>
  <text x="90" y="660" class="note">inbound main</text><text x="90" y="760" class="note">outbound main</text>
  <text x="680" y="600" class="danger">turnouts/control only after AG-4</text>
  <rect class="panel" x="950" y="445" width="510" height="460" rx="8"/>
  <text x="975" y="480" class="title" style="font-size:21px">Grade + safety rules</text>
  <text x="980" y="530" class="label">Preferred average profile</text><text x="980" y="554" class="note">1 ascending rail + ≥11 level = 1:12</text>
  <text x="980" y="598" class="label">Absolute through-route limit</text><text x="980" y="622" class="note">1 ascending rail + ≥7 level = 1:8</text>
  <text x="980" y="666" class="label">Keep level</text><text x="980" y="690" class="note">stations · turnouts · detectors · loops</text><text x="980" y="714" class="note">8 level rails before/after curves/turnouts</text>
  <text x="980" y="768" class="danger">No public claim from this diagram.</text><text x="980" y="792" class="danger">Every site needs fresh source + inverse package.</text>
</svg>
