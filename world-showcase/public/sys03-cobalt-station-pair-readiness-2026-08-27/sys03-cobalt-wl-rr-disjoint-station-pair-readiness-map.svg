<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740"><style>.title{font:700 22px system-ui;fill:#f1f5f9}.sub{font:13px system-ui;fill:#cbd5e1}.label{font:600 12px system-ui;fill:#f8fafc}.small{font:11px system-ui;fill:#cbd5e1}.axis{font:11px ui-monospace,monospace;fill:#94a3b8}</style><rect width="100%" height="100%" fill="#091321"/><text x="32" y="36" class="title">SYS03 Cobalt station-pair candidate — Westlight PR-W02 ↔ Ravensreach PR-W04</text><text x="32" y="59" class="sub">Source-bound readiness plane only; it identifies an excluded-hold candidate, not a passenger alignment or opening.</text><rect x="84" y="100" width="1100" height="470" fill="#12263a" stroke="#436277"/><rect x="119.48387096774194" y="172.30769230769232" width="393.8709677419355" height="343.4615384615384" fill="#1d4ed844" stroke="#60a5fa" stroke-width="2"/><text x="124.48387096774194" y="188.30769230769232" class="label">candidate envelope</text> <rect x="140.7741935483871" y="262.6923076923077" width="67.41935483870967" height="21.69230769230768" fill="#22c55e55" stroke="#86efac" stroke-width="2"/><text x="145.7741935483871" y="278.6923076923077" class="label">Westlight built deck</text> <rect x="474.32258064516134" y="454.3076923076923" width="17.74193548387092" height="18.076923076923038" fill="#22c55e55" stroke="#86efac" stroke-width="2"/><text x="479.32258064516134" y="470.3076923076923" class="label">RR-SE-1 sealed sleeve</text> <rect x="492.06451612903226" y="461.53846153846155" width="17.741935483870975" height="10.846153846153811" fill="#facc1555" stroke="#fde68a" stroke-width="2"/><text x="497.06451612903226" y="477.53846153846155" class="label">RR second-route input</text> <rect x="775.9354838709677" y="165.0769230769231" width="70.96774193548401" height="72.30769230769229" fill="#dc262655" stroke="#fca5a5" stroke-width="2"/><text x="780.9354838709677" y="181.0769230769231" class="label">R10-NORMAL-ALIGNMENT-FLUID-GRAVITY-HOLD — excluded</text><rect x="1130.774193548387" y="165.0769230769231" width="21.290322580645125" height="72.30769230769229" fill="#dc262655" stroke="#fca5a5" stroke-width="2"/><text x="1135.774193548387" y="181.0769230769231" class="label">R10-NORTH-TURN-WATER-BUBBLE-HOLD — excluded</text><path d="M272.06451612903226 210.26923076923077 L401.5806451612903 327.7692307692308 L444.1612903225806 463.34615384615387" fill="none" stroke="#67e8f9" stroke-width="8"/><text x="225.93548387096774" y="170.53846153846155" class="small">sealed corridor Legs A/B/C</text><text x="84" y="610" class="label">Disjointness: candidate max X = -150; normal-alignment hold starts X = -75 (75-block coordinate separation); north-turn starts X = 25 (175-block coordinate separation).</text><text x="84" y="633" class="small">The candidate retains R10 holds, B09 maintenance-only assets, Westlight Venue, Approach Road, Ravensreach library/civic rooms, and Ravensgate exclusion as protected external interfaces.</text><text x="84" y="657" class="small">Missing before any passenger claim: PC-01 through PC-08, including stations, directional guideways, platform edges, power/signals, two-discharge rescue, trials, operating return, and a fresh release kernel.</text></svg>
