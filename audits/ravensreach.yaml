# Ravensreach — repeatable structural audit
#
# Run:  python3 scripts/audit.py audits/ravensreach.yaml --refresh
# Diff: python3 scripts/audit.py audits/ravensreach.yaml --json today.json --baseline yesterday.json
#
# EVERY box below comes from geometry MEASURED against the world, not from a design
# document. That distinction is the whole point: this town's docs have been wrong in
# both directions repeatedly, and assertions written from a doc would encode the same
# errors the audits made by hand.
#
# Known-corrected geometry baked in here:
#   * house:Surveyor is 13x8 at z[-407,-400], NOT the 13x11 the plan claimed -- its
#     northern rows are physically inside the storehouse.
#   * town_hall is 27x14 from x=-98, not 25x13 from x=-97; the roof overhangs by one
#     on three faces.
#   * the well is 5x10x3 CONTENT at (-85,68,-359); the registry recorded a 19x12x23
#     schematic canvas, which is a different thing.
#   * the oak grove is 8 trees and shrinking because the fleet harvests it. That is
#     accepted behaviour, so there is deliberately NO assertion demanding 17 trees.
#
# When a check fails, fix the WORLD or fix the ASSERTION -- but say which, and why.

name: Ravensreach structural audit
snapshot:
  near: "-85,-375"
  radius: 250

groups:

  # ---------------------------------------------------------------- ground
  - name: Site
    checks:
      - name: plaza is paved in Amsterdam klinker at y67
        # RE-BASELINED 2026-07-26. The square was rebuilt to read as an Amsterdam
        # one: banded klinker brickwork instead of a single flat tone of stone_bricks,
        # so the old assertion (>=1050 stone_bricks) correctly went red. The baseline
        # diff catching that is the mechanism working. Measured after the rebuild:
        #   bricks 434 + mud_bricks 205 + granite 156 + polished_granite 131 = 926
        # The 527 polished_andesite in this box is the Moot Hall's own ground floor,
        # which is asserted separately and is deliberately NOT klinker.
        type: contains
        box: [-105, 67, -395, -65, 67, -355]
        materials: [bricks, mud_bricks, granite, polished_granite]
        min: 880
      - name: ground plane holds at y67 (no holes at sampled span)
        # The west canal is a deliberate 4-wide void through this box, so it is
        # excluded rather than tolerated -- a loosened fraction would also hide a
        # real hole somewhere else, which is the failure mode this check exists for.
        type: solid
        box: [-105, 67, -395, -65, 67, -355]
        exclude:
          - [-105, 67, -395, -102, 67, -356]
        min_fraction: 0.98
      - name: plaza has no unpaved grass holes
        # ADDED after a survey found 50 grass_block cells in the repave that the
        # stone_bricks count alone sailed past. The plaza check was PASSING at 1306
        # bricks while 50 cells were bare turf: counting what SHOULD be there does not
        # catch what should NOT be. Assert both directions.
        type: absent
        box: [-105, 67, -395, -65, 67, -355]
        exclude:
          # The four 3x3 corner planters are DELIBERATE green, per the masterplan.
          # This check went red at exactly 36 cells = 4 x 9 the moment they were
          # planted, which is the assertion failing to distinguish a planting bed from
          # an unpaved hole. Both are grass on a plaza; only one is a defect.
          - [-104, 67, -394, -102, 67, -392]
          - [-68, 67, -394, -66, 67, -392]
          - [-104, 67, -358, -102, 67, -356]
          - [-68, 67, -358, -66, 67, -356]
        materials: [grass_block, dirt, coarse_dirt, podzol]
      - name: no furniture abandoned on the open plaza
        # Originally caught a double red bed exposed at (-89..-88,68,-385) with no
        # building on it (since removed).
        #
        # Then it caught the MOOT HALL'S OWN strongroom chests and archive barrels,
        # because the plaza box necessarily contains the building standing in it. That
        # was a false positive of mine, not a defect -- exactly the shape of error this
        # whole tool exists to eliminate. Hence `exclude`.
        type: absent
        box: [-105, 68, -395, -65, 68, -355]
        exclude:
          - [-100, 68, -392, -70, 68, -376]   # Moot Hall main block
          - [-88, 68, -375, -82, 68, -369]    # Moot Hall bell tower
        materials: [red_bed, chest, barrel, furnace, crafting_table]
      - name: no water on the plaza surface
        type: absent
        box: [-105, 68, -395, -65, 70, -355]
        materials: [water]

  # ---------------------------------------------------------------- town hall
  # Course-by-course, because "the walls are gone but the interior remains" is exactly
  # the failure the operator reported, and only a per-layer count catches it.
  # REWRITTEN 2026-07-26 for the MOOT HALL. The previous assertions described the old
  # 25x13 single-storey hall, which was demolished and replaced. A spec that keeps
  # describing a demolished building is worse than no spec: it fails forever and
  # trains the reader to ignore red.
  - name: Moot Hall
    checks:
      - name: floor course y67
        type: contains
        box: [-100, 67, -392, -70, 67, -376]
        materials: [polished_andesite]
        min: 450
      - name: wall course y70 (ground storey)
        type: ring
        box: [-100, 70, -392, -70, 70, -376]
        materials: [stone_bricks, spruce_log, glass_pane, chiseled_stone_bricks]
        tolerance: 10
      - name: wall course y75 (first storey)
        type: ring
        box: [-100, 75, -392, -70, 75, -376]
        materials: [stone_bricks, spruce_log, glass_pane, chiseled_stone_bricks]
        tolerance: 10
      - name: chiseled string course y73
        type: ring
        box: [-100, 73, -392, -70, 73, -376]
        materials: [chiseled_stone_bricks, spruce_log]
        tolerance: 6
      - name: roof present y87-96
        # RE-BASELINED TWICE.
        # (1) Two storeys were added to the hall, so the roof moved from y77-85 to
        #     y87-96 and the old box was measuring the new SECOND FLOOR. Measured
        #     after the raise: 597 spruce_stairs.
        # (2) 2026-07-26: the roof VOID was then converted into the penthouse, which
        #     hollowed out the roof's interior fill -- 597 -> 257. That is what an
        #     attic conversion is. The outer slopes are untouched: the penthouse sits
        #     3 blocks inside the hall footprint on every side, and the six dormers
        #     are glazed. The world is right and the number was stale, so the number
        #     moved. Re-measured: 257.
        type: contains
        box: [-101, 87, -393, -69, 96, -375]
        materials: [spruce_stairs]
        min: 240
      - name: ridge y97
        # Followed the roof up. Measured: 33 spruce_planks along the ridge line.
        type: contains
        box: [-101, 97, -393, -69, 97, -375]
        materials: [spruce_planks]
        min: 30
      - name: bell tower reaches the spire
        type: contains
        box: [-88, 88, -375, -82, 95, -369]
        materials: [stone_bricks, spruce_planks, spruce_stairs, lantern]
        min: 40
      - name: bell re-hung in the belfry
        type: count
        box: [-87, 88, -374, -83, 90, -370]
        materials: [bell]
        expect: 1
      - name: mayor's office is fitted out
        # The operator's explicit brief was "multiple rooms and a mayor office".
        # Assert the office EXISTS as a furnished room, not merely as empty volume.
        type: contains
        box: [-82, 74, -383, -71, 76, -377]
        materials: [bookshelf, spruce_planks, red_carpet, chest, red_wall_banner, decorated_pot]
        min: 20
      - name: council chamber dais present
        type: contains
        box: [-99, 68, -387, -97, 69, -381]
        materials: [polished_andesite, red_carpet, stone_brick_stairs, lectern]
        min: 20
      - name: interior partitions divide the rooms
        # Walls A and B are what make this "multiple rooms" rather than one shed.
        type: contains
        box: [-87, 68, -391, -83, 77, -377]
        materials: [stone_bricks]
        min: 200
      - name: strongroom is lockable
        type: count
        box: [-77, 68, -381, -75, 69, -379]
        materials: [iron_door]
        expect: 2

  # ---------------------------------------------------------------- cottages
  # Each cottage gets the same three assertions: a wall course, a roof, and its
  # interior fittings. If walls fail while fittings pass, that IS the "furniture
  # floating in an open shell" symptom -- and the pair of results says so precisely.
  - name: Cottage Architect
    checks:
      - name: wall course y69
        type: ring
        box: [-124, 69, -380, -112, 69, -370]
        materials: [cobblestone, spruce_log, glass_pane]
        tolerance: 8
      - name: roof y74-77
        type: contains
        box: [-124, 74, -380, -112, 77, -370]
        materials: [spruce_stairs, spruce_planks]
        min: 40
      - name: interior fittings present
        type: contains
        box: [-123, 68, -379, -113, 68, -371]
        materials: [red_bed, chest, furnace, crafting_table, cartography_table, lectern]
        min: 5

  - name: Cottage Mason
    checks:
      - name: wall course y69
        type: ring
        box: [-58, 69, -380, -46, 69, -370]
        materials: [cobblestone, spruce_log, glass_pane]
        tolerance: 8
      - name: roof y74-77
        type: contains
        box: [-58, 74, -380, -46, 77, -370]
        materials: [spruce_stairs, spruce_planks]
        min: 40
      - name: interior fittings present
        type: contains
        box: [-57, 68, -379, -47, 68, -371]
        materials: [red_bed, chest, furnace, crafting_table, stonecutter, smithing_table]
        min: 5

  - name: Cottage Scout
    checks:
      - name: wall course y69
        type: ring
        box: [-64, 69, -350, -52, 69, -340]
        materials: [cobblestone, spruce_log, glass_pane, stone_bricks]
        tolerance: 8
      - name: roof y74-77
        type: contains
        box: [-64, 74, -350, -52, 77, -340]
        materials: [spruce_stairs, spruce_planks]
        min: 40
      - name: interior fittings present
        type: contains
        box: [-63, 68, -349, -53, 68, -341]
        materials: [red_bed, chest, furnace, crafting_table, barrel, cartography_table]
        min: 5

  - name: Cottage Steward
    checks:
      - name: wall course y69
        type: ring
        box: [-118, 69, -350, -106, 69, -340]
        materials: [cobblestone, spruce_log, glass_pane]
        tolerance: 8
      - name: roof y74-77
        type: contains
        box: [-118, 74, -350, -106, 77, -340]
        materials: [spruce_stairs, spruce_planks]
        min: 40
      - name: interior fittings present
        type: contains
        box: [-117, 68, -349, -107, 68, -341]
        materials: [red_bed, chest, furnace, crafting_table, barrel, composter]
        min: 5

  - name: Cottage Surveyor
    checks:
      # 13x8 as-built, NOT the 13x11 in the plan.
      - name: wall course y69
        type: ring
        box: [-91, 69, -407, -79, 69, -400]
        materials: [cobblestone, spruce_log, glass_pane]
        tolerance: 8
      - name: north wall at z=-407 exists
        type: contains
        box: [-91, 69, -407, -79, 71, -407]
        materials: [cobblestone, spruce_log, glass_pane]
        min: 20
      - name: interior fittings present
        type: contains
        box: [-90, 68, -406, -80, 68, -401]
        materials: [red_bed, chest, furnace, crafting_table, cartography_table]
        min: 5

  # ---------------------------------------------------------------- storehouse
  - name: Storehouse
    checks:
      - name: shell walls y70
        type: ring
        box: [-95, 70, -420, -75, 70, -408]
        materials: [stone_bricks]
        tolerance: 8
      - name: lid y74
        type: contains
        box: [-95, 74, -420, -75, 74, -408]
        materials: [smooth_stone, stone_bricks]
        min: 200
      - name: four chests present
        type: count
        box: [-94, 68, -419, -76, 68, -409]
        materials: [chest]
        expect: 4
      - name: door fitted to the entrance
        type: count
        box: [-86, 68, -409, -84, 69, -407]
        materials: [spruce_door]
        expect: 2      # a door is two blocks

  # ---------------------------------------------------------------- well
  - name: Well
    checks:
      - name: structure present
        type: contains
        box: [-86, 68, -360, -80, 78, -356]
        materials: [cobblestone, stone, dark_oak_planks, dark_oak_stairs]
        min: 60
      - name: no uncontained water spilling
        type: absent
        box: [-95, 68, -370, -70, 72, -345]
        materials: [water]

  # ---------------------------------------------------------------- hazards
  # Assertions that exist to catch REGRESSIONS, not to describe intent. Each one
  # corresponds to something that actually went wrong here.
  - name: Regression guards
    checks:
      - name: no gardens in the sky
        # Originally 28 rose bushes and grass platforms floating at y90-92 with nothing
        # under them. The wizard tower they belonged to was DESIGNED (its parapet posts
        # stood at y107-109 marking the footprint) and never built — its fittings were
        # placed and its shell was not.
        #
        # The tower has now been constructed and the overhanging platforms corbelled,
        # so those gardens are a planted roof terrace rather than debris. The tower is
        # excluded rather than the assertion weakened: planting above roof height ANY-
        # WHERE ELSE is still wrong, and that is what this check is for.
        type: absent
        box: [-130, 85, -425, -40, 130, -310]
        exclude:
          - [-86, 85, -336, -70, 130, -320]   # wizard tower + its balconies
        materials: [rose_bush, grass_block, dirt, short_grass, poppy, dandelion, oak_sapling]
      - name: no nether farm above the town
        # soul_sand + nether_wart at y83-88, likewise inside the tower now that it has
        # walls. A nether farm on a wizard tower's floor is a room; the same blocks
        # hanging in open air were not.
        type: absent
        box: [-130, 80, -425, -40, 130, -310]
        exclude:
          - [-86, 80, -336, -70, 130, -320]
        materials: [soul_sand, nether_wart, soul_soil, netherrack]
      - name: no floating blocks in open sky above the town
        # Deliberately starts ABOVE the legitimate tall structures: the town-hall
        # belfry reaches y100 and the annex watchtower y109, and both are grounded.
        # An assertion that flagged them would be noise, and noisy checks get ignored.
        type: empty
        box: [-130, 112, -425, -40, 140, -310]
      # RETIRED 2026-07-26 -- "mine apron intact".
      # The Central Pavilion was built on this pad and its foundation replaced the
      # apron's stone_bricks with stone. Before retiring the check I looked for what
      # the apron was an apron TO: there is no shaft, no rail, no ladder and no torch
      # anywhere below it down to y20. It was a paved pad with nothing behind it,
      # consistent with mining.mineSite being empty for this world. Nothing functional
      # was buried, so this is a change of land use and not damage -- but it is being
      # recorded as such rather than quietly deleted.
      - name: no nether blocks in an overworld town
        # A previous debris sweep found soul_sand and nether_wart at y83-88 here.
        type: absent
        box: [-130, 68, -425, -40, 120, -335]
        materials: [soul_sand, nether_wart, netherrack, soul_soil]

  # ---------------------------------------------------------------- public realm
  # The operator's complaint was "no common roads, paths, gardens". Before this work
  # the entire district held 27 gravel blocks and one four-block path.
  - name: Public realm
    checks:
      - name: road network exists
        type: contains
        box: [-130, 62, -440, -40, 70, -330]
        materials: [gravel]
        min: 700
      - name: streets are lit
        type: contains
        box: [-130, 68, -440, -40, 72, -330]
        materials: [lantern, spruce_fence]
        min: 40
      - name: kitchen gardens planted
        type: contains
        box: [-130, 67, -372, -40, 68, -330]
        materials: [farmland, spruce_fence_gate]
        min: 60

  # ---------------------------------------------------------------- annex
  # Buildings whose fittings were placed by the town brain and whose shells never
  # were. Each assertion pairs a WALL count with a FITTING count: if walls fail while
  # fittings pass, that is precisely the "furniture floating in an open shell" symptom
  # the operator reported, and the pair says so unambiguously.
  - name: Annex buildings
    checks:
      - name: wizard tower is walled
        type: contains
        box: [-84, 68, -334, -72, 106, -322]
        materials: [stone_bricks, chiseled_stone_bricks, spruce_log]
        min: 1200
      - name: wizard tower fittings enclosed
        type: contains
        box: [-84, 68, -334, -72, 106, -322]
        materials: [barrel, chest, furnace, bookshelf, enchanting_table]
        min: 30
      - name: market longhouse is walled
        type: contains
        box: [-73, 68, -344, -39, 90, -323]
        materials: [cobblestone, spruce_log]
        min: 1000
      - name: market longhouse is roofed
        type: contains
        box: [-74, 79, -345, -38, 91, -322]
        materials: [spruce_stairs, spruce_planks]
        min: 500
      - name: group B is walled
        type: contains
        box: [-65, 68, -370, -41, 80, -352]
        materials: [stone_bricks, spruce_log]
        min: 700
      - name: group B is roofed
        type: contains
        box: [-66, 81, -371, -40, 90, -351]
        materials: [spruce_stairs, spruce_planks]
        min: 250

  # ---------------------------------------------- civic quarter (built 2026-07-26)
  # Every minimum below is MEASURED from the world after the build, then given a
  # margin -- not taken from the generator that produced it. Where the two disagree
  # the world wins, which is the entire reason this file exists.
  - name: Amsterdam square
    checks:
      - name: canals hold water
        type: contains
        box: [-105, 63, -395, -102, 67, -356]
        materials: [water]
        min: 400                       # measured 452
      - name: east canal holds water
        type: contains
        box: [-63, 63, -395, -60, 67, -356]
        materials: [water]
        min: 400                       # measured 437
      - name: canals do not leak south
        # ADDED after they DID leak. Both canals were dug with open ends; water ran
        # out of the south end and put 23 blocks of it inside Cottage Scout, plus
        # 107 more across the ground between. End walls now cap both ends at z=-396
        # and z=-355. The 9 water blocks left in this box are the Market Hall's farm
        # irrigation channel at x=-61 y67, which is deliberate and is excluded.
        # `absent`, not `contains` with a ceiling: audit.py's contains only takes a
        # MINIMUM, so an earlier draft of this check passed with 9 blocks of escaped
        # water simply because 9 >= 1. A leak check that passes when it finds water
        # is worse than no check at all.
        type: absent
        box: [-112, 63, -354, -50, 68, -325]
        materials: [water]
        exclude:
          - [-66, 67, -340, -56, 67, -332]
      - name: canals do not leak north
        type: absent
        box: [-112, 63, -410, -50, 68, -397]
        materials: [water]
      - name: gable terrace closes the south side
        type: contains
        box: [-105, 68, -352, -65, 92, -346]
        materials: [bricks, red_terracotta, brown_terracotta, glass_pane, spruce_planks]
        min: 1200                      # measured 3181 non-air overall
      - name: the monument stands
        type: contains
        box: [-88, 67, -363, -82, 86, -357]
        materials: [quartz_pillar, chiseled_quartz_block, smooth_quartz, quartz_stairs, sea_lantern]
        min: 60                        # measured 125

  - name: Library
    checks:
      - name: all six storeys have a floor
        type: contains
        box: [-142, 46, -446, -113, 83, -428]
        materials: [polished_andesite, stone_bricks, deepslate_bricks]
        min: 2400                      # measured ~570 per plate x 6
      - name: stair core runs the full height
        type: contains
        box: [-119, 46, -445, -115, 89, -439]
        materials: [polished_andesite, lantern]
        min: 240                       # measured 269 of these two materials
                                       # (459 was the non-air total, a different thing)
      - name: roof is on
        type: contains
        box: [-145, 90, -449, -110, 98, -425]
        materials: [deepslate_tiles, glass]
        min: 1400                      # measured 1752
      - name: no floating fittings above the roof
        # Box narrowed to the GRADED footprint. The first version reached to x=-150
        # and z=-420 and reported 255 "floating" blocks that were an ungraded natural
        # hillside outside the build. A guard that cries wolf over terrain gets muted.
        type: empty
        box: [-147, 100, -451, -108, 130, -423]

  - name: Central Pavilion
    checks:
      - name: floor is laid
        type: contains
        box: [-105, 67, -449, -65, 67, -425]
        materials: [smooth_stone, polished_andesite, stone_bricks, polished_diorite, water]
        min: 900                       # measured 1025
      - name: colonnade stands
        type: contains
        box: [-105, 68, -449, -65, 78, -425]
        materials: [polished_diorite, polished_diorite_wall]
        min: 180                       # measured 226
      - name: glass vault is closed
        type: contains
        box: [-105, 79, -449, -65, 85, -425]
        materials: [light_gray_stained_glass, smooth_quartz]
        min: 900                       # measured 1025
      - name: it is open to walk through
        # The pavilion's whole point is that you can cross it in any direction, so
        # this asserts EMPTY at head height rather than a solid fraction.
        type: empty
        box: [-103, 72, -447, -67, 72, -427]
